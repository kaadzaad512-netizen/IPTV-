name: Build Stalker IPTV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create professional Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/stalkeriptv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.example.stalkeriptv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.stalkeriptv'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.8.0'
              implementation 'androidx.media3:media3-ui:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#0B1020</color>
              <color name="surface">#121A2B</color>
              <color name="surface2">#19243A</color>
              <color name="accent">#36D1DC</color>
              <color name="accent2">#5B86E5</color>
              <color name="text">#F5F7FA</color>
              <color name="muted">#9AA7BD</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:navigationBarColor">#080C16</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="Stalker IPTV"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/stalkeriptv/MainActivity.java <<'EOF'
          package com.example.stalkeriptv;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import java.util.*;
          import org.json.*;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;

          @UnstableApi
          public class MainActivity extends Activity {
              static final int BG=Color.rgb(11,16,32), SURFACE=Color.rgb(18,26,43);
              static final int SURFACE2=Color.rgb(25,36,58), ACCENT=Color.rgb(54,209,220);
              static final int TEXT=Color.rgb(245,247,250), MUTED=Color.rgb(154,167,189);

              LinearLayout root, content, cards, nav;
              EditText portalEdit, macEdit, searchEdit;
              TextView title, subtitle, pageText, status;
              Button liveTab, vodTab, seriesTab, prev, next;
              String portal="", workingPortal="", token="", mac="";
              int mode=0, page=1;
              ExoPlayer player;
              PlayerView playerView;
              ArrayList<JSONObject> currentItems=new ArrayList<>();

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(Color.rgb(7,10,18));
                  showLogin();
              }

              TextView tv(String s,float size,int color){
                  TextView t=new TextView(this); t.setText(s); t.setTextSize(size); t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL); return t;
              }

              GradientDrawable bg(int color,float radius){
                  GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(radius); return g;
              }

              Button button(String s){
                  Button b=new Button(this); b.setText(s); b.setTextColor(TEXT); b.setTextSize(13);
                  b.setAllCaps(false); b.setBackground(bg(SURFACE2,22));
                  b.setPadding(20,0,20,0); return b;
              }

              void showLogin(){
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(28,28,28,24);
                  root.setBackgroundColor(BG);
                  ScrollView scroll=new ScrollView(this); scroll.setBackgroundColor(BG);
                  LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(0,30,0,30);

                  TextView brand=tv("STALKER IPTV",30,TEXT);
                  brand.setTypeface(null,1); box.addView(brand);
                  TextView desc=tv("Professional IPTV player",16,MUTED);
                  box.addView(desc,new LinearLayout.LayoutParams(-1,55));

                  LinearLayout card=new LinearLayout(this); card.setOrientation(LinearLayout.VERTICAL); card.setPadding(22,22,22,22);
                  card.setBackground(bg(SURFACE,28));

                  portalEdit=new EditText(this); portalEdit.setHint("Portal URL"); portalEdit.setTextColor(TEXT);
                  portalEdit.setHintTextColor(MUTED); portalEdit.setSingleLine(true);
                  portalEdit.setPadding(18,0,18,0); portalEdit.setBackground(bg(SURFACE2,18));
                  card.addView(portalEdit,new LinearLayout.LayoutParams(-1,58));

                  macEdit=new EditText(this); macEdit.setHint("Authorized MAC address"); macEdit.setTextColor(TEXT);
                  macEdit.setHintTextColor(MUTED); macEdit.setSingleLine(true);
                  macEdit.setPadding(18,0,18,0); macEdit.setBackground(bg(SURFACE2,18));
                  LinearLayout.LayoutParams mp=new LinearLayout.LayoutParams(-1,58); mp.topMargin=14; card.addView(macEdit,mp);

                  Button connect=button("CONNECT TO PORTAL");
                  connect.setTextSize(15); connect.setTextColor(Color.WHITE);
                  connect.setBackground(bg(ACCENT2,22));
                  LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,58); cp.topMargin=18; card.addView(connect,cp);

                  status=tv("Use only an authorized portal and MAC.",13,MUTED);
                  status.setPadding(4,16,4,0); card.addView(status);
                  box.addView(card);

                  TextView info=tv("LIVE  •  VOD  •  SERIES\nSearch, pagination and built-in full-screen playback",14,MUTED);
                  info.setPadding(4,28,4,0); box.addView(info);

                  scroll.addView(box); root.addView(scroll);
                  setContentView(root);

                  connect.setOnClickListener(v->connect());
              }

              void connect(){
                  portal=portalEdit.getText().toString().trim();
                  mac=macEdit.getText().toString().trim().toUpperCase();
                  if(portal.isEmpty()||mac.isEmpty()){status.setText("Enter portal and authorized MAC.");return;}
                  if(!mac.matches("([0-9A-F]{2}:){5}[0-9A-F]{2}")){status.setText("Invalid MAC format.");return;}
                  status.setText("Connecting...");
                  new Thread(()->{
                      try{
                          workingPortal=normalize(portal);
                          JSONObject h=getJson(workingPortal+"?type=stb&action=handshake&JsHttpRequest=1-xml&mac="+enc(mac));
                          JSONObject js=h.optJSONObject("js");
                          if(js==null||!js.has("token"))throw new Exception("Handshake failed");
                          token=js.optString("token","");
                          if(token.startsWith("~"))token=token.substring(1);
                          getJson(workingPortal+"?type=account_info&action=get_main_info&JsHttpRequest=1-xml");
                          runOnUiThread(this::showHome);
                      }catch(Exception e){runOnUiThread(()->status.setText("Connection failed: "+e.getMessage()));}
                  }).start();
              }

              void showHome(){
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(BG);
                  root.addView(header(),new LinearLayout.LayoutParams(-1,78));
                  root.addView(tabs(),new LinearLayout.LayoutParams(-1,62));
                  LinearLayout searchRow=new LinearLayout(this); searchRow.setPadding(16,8,16,8);
                  searchEdit=new EditText(this); searchEdit.setHint("Search channels, movies, series...");
                  searchEdit.setTextColor(TEXT); searchEdit.setHintTextColor(MUTED); searchEdit.setSingleLine(true);
                  searchEdit.setPadding(18,0,18,0); searchEdit.setBackground(bg(SURFACE,20));
                  searchRow.addView(searchEdit,new LinearLayout.LayoutParams(0,52,1));
                  Button sb=button("SEARCH"); sb.setOnClickListener(v->renderCurrent());
                  LinearLayout.LayoutParams sbp=new LinearLayout.LayoutParams(105,52); sbp.leftMargin=8; searchRow.addView(sb,sbp);
                  root.addView(searchRow);

                  ScrollView scroll=new ScrollView(this);
                  content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(16,8,16,16);
                  scroll.addView(content); root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  LinearLayout pager=new LinearLayout(this); pager.setGravity(Gravity.CENTER); pager.setPadding(10,7,10,10);
                  prev=button("‹"); next=button("›"); pageText=tv("Page 1",14,TEXT); pageText.setGravity(Gravity.CENTER);
                  pager.addView(prev,new LinearLayout.LayoutParams(70,48));
                  pager.addView(pageText,new LinearLayout.LayoutParams(110,48));
                  pager.addView(next,new LinearLayout.LayoutParams(70,48));
                  root.addView(pager);

                  setContentView(root);
                  prev.setOnClickListener(v->{if(page>1){page--;loadMode();}});
                  next.setOnClickListener(v->{page++;loadMode();});
                  loadMode();
              }

              View header(){
                  LinearLayout h=new LinearLayout(this); h.setGravity(Gravity.CENTER_VERTICAL); h.setPadding(20,0,12,0);
                  LinearLayout names=new LinearLayout(this); names.setOrientation(LinearLayout.VERTICAL);
                  title=tv("STALKER IPTV",19,TEXT); title.setTypeface(null,1); names.addView(title);
                  subtitle=tv("Connected",11,MUTED); names.addView(subtitle);
                  h.addView(names,new LinearLayout.LayoutParams(0,-1,1));
                  Button logout=button("EXIT"); logout.setOnClickListener(v->{stopPlayer();showLogin();});
                  h.addView(logout,new LinearLayout.LayoutParams(82,46));
                  return h;
              }

              View tabs(){
                  nav=new LinearLayout(this); nav.setPadding(12,7,12,7); nav.setBackgroundColor(Color.rgb(9,14,27));
                  liveTab=button("LIVE"); vodTab=button("VOD"); seriesTab=button("SERIES");
                  nav.addView(liveTab,new LinearLayout.LayoutParams(0,48,1));
                  nav.addView(vodTab,new LinearLayout.LayoutParams(0,48,1));
                  nav.addView(seriesTab,new LinearLayout.LayoutParams(0,48,1));
                  liveTab.setOnClickListener(v->{mode=0;page=1;loadMode();});
                  vodTab.setOnClickListener(v->{mode=1;page=1;loadMode();});
                  seriesTab.setOnClickListener(v->{mode=2;page=1;loadMode();});
                  return nav;
              }

              void loadMode(){
                  pageText.setText("Page "+page);
                  statusLine("Loading "+(mode==0?"LIVE":mode==1?"VOD":"SERIES")+"...");
                  new Thread(()->{
                      try{
                          ArrayList<JSONObject> a;
                          if(mode==0)a=live(page); else if(mode==1)a=vod(page); else a=series(page);
                          currentItems=a;
                          runOnUiThread(()->draw(a));
                      }catch(Exception e){runOnUiThread(()->statusLine("Load error: "+e.getMessage()));}
                  }).start();
              }

              void renderCurrent(){draw(currentItems);}

              void draw(ArrayList<JSONObject> items){
                  content.removeAllViews();
                  String q=searchEdit==null?"":searchEdit.getText().toString().trim().toLowerCase();
                  int shown=0;
                  for(JSONObject x:items){
                      String name=x.optString("name",x.optString("title","Item"));
                      if(!q.isEmpty()&&!name.toLowerCase().contains(q))continue;
                      content.addView(card(x,name));
                      shown++;
                  }
                  statusLine(shown+" items");
              }

              View card(JSONObject item,String name){
                  LinearLayout c=new LinearLayout(this); c.setOrientation(LinearLayout.HORIZONTAL);
                  c.setGravity(Gravity.CENTER_VERTICAL); c.setPadding(16,10,12,10); c.setBackground(bg(SURFACE,22));
                  TextView icon=tv(mode==0?"▶":mode==1?"▣":"◆",22,ACCENT); icon.setGravity(Gravity.CENTER);
                  c.addView(icon,new LinearLayout.LayoutParams(54,70));
                  LinearLayout text=new LinearLayout(this); text.setOrientation(LinearLayout.VERTICAL);
                  TextView n=tv(name,16,TEXT); n.setTypeface(null,1); text.addView(n);
                  String sub=item.optString("category_name",item.optString("genre",""));
                  if(sub.isEmpty())sub=mode==0?"Live channel":mode==1?"Movie":"Series";
                  text.addView(tv(sub,12,MUTED));
                  c.addView(text,new LinearLayout.LayoutParams(0,70,1));
                  Button play=button(mode==2?"OPEN":"PLAY");
                  c.addView(play,new LinearLayout.LayoutParams(82,48));
                  LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,90); cp.bottomMargin=9;

                  if(mode==0)play.setOnClickListener(v->playLive(item));
                  else if(mode==1)play.setOnClickListener(v->playVod(item));
                  else play.setOnClickListener(v->openSeries(item));
                  c.setOnClickListener(v->{if(mode==0)playLive(item);else if(mode==1)playVod(item);else openSeries(item);});
                  FrameLayout wrap=new FrameLayout(this); wrap.addView(c,cp); return wrap;
              }

              ArrayList<JSONObject> live(int p)throws Exception{
                  JSONObject d=getJson(workingPortal+"?type=itv&action=get_all_channels&JsHttpRequest=1-xml");
                  return arr(d);
              }

              ArrayList<JSONObject> vod(int p)throws Exception{
                  String u=workingPortal+"?type=vod&action=get_ordered_list&JsHttpRequest=1-xml&p="+p+"&items_per_page=30";
                  return arr(getJson(u));
              }

              ArrayList<JSONObject> series(int p)throws Exception{
                  String u=workingPortal+"?type=series&action=get_ordered_list&JsHttpRequest=1-xml&p="+p+"&items_per_page=30";
                  return arr(getJson(u));
              }

              ArrayList<JSONObject> arr(JSONObject d){
                  ArrayList<JSONObject> out=new ArrayList<>();
                  JSONObject js=d.optJSONObject("js");
                  if(js==null)return out;
                  JSONArray a=js.optJSONArray("data");
                  if(a==null)return out;
                  for(int i=0;i<a.length();i++){JSONObject x=a.optJSONObject(i);if(x!=null)out.add(x);}
                  return out;
              }

              void playLive(JSONObject x){
                  String id=x.optString("id","");
                  new Thread(()->{
                      try{
                          JSONObject d=getJson(workingPortal+"?type=itv&action=create_link&JsHttpRequest=1-xml&cmd="+enc("ffmpeg http://localhost/ch/"+id));
                          openStream(extract(d));
                      }catch(Exception e){statusLine("Playback error: "+e.getMessage());}
                  }).start();
              }

              void playVod(JSONObject x){
                  String id=x.optString("id",x.optString("movie_id",""));
                  new Thread(()->{
                      try{
                          JSONObject d=getJson(workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));
                          openStream(extract(d));
                      }catch(Exception e){statusLine("Playback error: "+e.getMessage());}
                  }).start();
              }

              void openSeries(JSONObject x){
                  String id=x.optString("id",x.optString("series_id",""));
                  new Thread(()->{
                      try{
                          ArrayList<JSONObject> eps=episodes(id);
                          runOnUiThread(()->showEpisodes(x.optString("name","Series"),eps));
                      }catch(Exception e){statusLine("Episode error: "+e.getMessage());}
                  }).start();
              }

              ArrayList<JSONObject> episodes(String id)throws Exception{
                  ArrayList<JSONObject> out=new ArrayList<>();
                  String[] qs={
                      workingPortal+"?type=series&action=get_ordered_list&JsHttpRequest=1-xml&movie_id="+enc(id)+"&p=1",
                      workingPortal+"?type=series&action=get_episodes&JsHttpRequest=1-xml&series_id="+enc(id)+"&p=1"
                  };
                  for(String q:qs){try{out=arr(getJson(q));if(!out.isEmpty())break;}catch(Exception ignored){}}
                  return out;
              }

              void showEpisodes(String seriesName,ArrayList<JSONObject> eps){
                  content.removeAllViews();
                  TextView h=tv("←  "+seriesName,20,TEXT); h.setPadding(6,8,6,18);
                  h.setOnClickListener(v->loadMode()); content.addView(h);
                  for(JSONObject e:eps){
                      String n=e.optString("name","Episode");
                      Button b=button("▶  "+n); b.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);
                      b.setOnClickListener(v->playEpisode(e));
                      LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,58);bp.bottomMargin=7;
                      content.addView(b,bp);
                  }
                  statusLine(eps.size()+" episodes");
              }

              void playEpisode(JSONObject e){
                  String id=e.optString("id",e.optString("episode_id",""));
                  new Thread(()->{
                      try{
                          JSONObject d=getJson(workingPortal+"?type=series&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));
                          openStream(extract(d));
                      }catch(Exception ex){statusLine("Episode playback error: "+ex.getMessage());}
                  }).start();
              }

              String extract(JSONObject d)throws Exception{
                  JSONObject j=d.optJSONObject("js"); if(j==null)throw new Exception("No stream returned");
                  String u=j.optString("cmd",""); if(u.isEmpty())u=j.optString("url","");
                  if(u.isEmpty())u=j.optString("link","");
                  if(u.isEmpty())u=j.optString("stream_url","");
                  if(u.isEmpty())throw new Exception("No stream URL returned");
                  u=u.replaceFirst("^(ffmpeg|vlc)\\s+","").trim();
                  return u;
              }

              void openStream(String u){
                  runOnUiThread(()->{
                      stopPlayer();
                      player=new ExoPlayer.Builder(this).build();
                      playerView=new PlayerView(this);
                      playerView.setPlayer(player);
                      playerView.setUseController(true);
                      playerView.setBackgroundColor(Color.BLACK);
                      playerView.setKeepScreenOn(true);
                      setContentView(playerView);
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                      player.addListener(new androidx.media3.common.Player.Listener(){
                          @Override public void onPlayerError(PlaybackException e){
                              Toast.makeText(MainActivity.this,"Playback error: "+e.getMessage(),Toast.LENGTH_LONG).show();
                          }
                      });
                      player.setMediaItem(MediaItem.fromUri(Uri.parse(u)));
                      player.prepare(); player.play();
                  });
              }

              @Override public void onBackPressed(){
                  if(player!=null){stopPlayer();getWindow().getDecorView().setSystemUiVisibility(0);showHome();}
                  else super.onBackPressed();
              }

              void stopPlayer(){if(player!=null){player.release();player=null;}}
              void statusLine(String s){runOnUiThread(()->{if(status!=null)status.setText(s);if(subtitle!=null)subtitle.setText(s);});}

              JSONObject getJson(String s)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(s).openConnection();
                  c.setConnectTimeout(10000);c.setReadTimeout(20000);c.setRequestMethod("GET");
                  c.setRequestProperty("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");
                  c.setRequestProperty("X-User-Agent","Model: MAG250; Link: WiFi");
                  c.setRequestProperty("Accept","*/*");
                  c.setRequestProperty("Referer","http://localhost/stalker_portal/c/");
                  c.setRequestProperty("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");
                  if(!token.isEmpty())c.setRequestProperty("Authorization","Bearer "+token);
                  int code=c.getResponseCode();if(code!=200)throw new Exception("HTTP "+code);
                  BufferedReader r=new BufferedReader(new InputStreamReader(c.getInputStream()));
                  StringBuilder b=new StringBuilder();String line;while((line=r.readLine())!=null)b.append(line);
                  r.close();c.disconnect();return new JSONObject(b.toString());
              }

              String normalize(String p){
                  p=p.trim();while(p.endsWith("/"))p=p.substring(0,p.length()-1);
                  if(p.endsWith("/portal.php"))return p;
                  if(p.endsWith("/c"))return p+"/portal.php";
                  return p+"/c/portal.php";
              }

              String enc(String s)throws Exception{return URLEncoder.encode(s,"UTF-8");}

              @Override protected void onDestroy(){stopPlayer();super.onDestroy();}
          }
          EOF

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StalkerIPTV-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
