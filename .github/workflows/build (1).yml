name: Build Stalker IPTV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/stalkeriptv app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.example.stalkeriptv'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.stalkeriptv'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@style/AppTheme"
                  android:label="Stalker IPTV"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/stalkeriptv/MainActivity.java <<'EOF'
          package com.example.stalkeriptv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import org.json.*;

          public class MainActivity extends Activity {
              EditText portalInput, macInput;
              TextView status;
              LinearLayout list;
              String workingPortal="", token="", mac="";

              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24,24,24,24);

                  TextView title=new TextView(this);
                  title.setText("Stalker IPTV Player");
                  title.setTextSize(24); title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  portalInput=new EditText(this);
                  portalInput.setHint("Portal URL"); portalInput.setSingleLine(true);
                  root.addView(portalInput);

                  macInput=new EditText(this);
                  macInput.setHint("Authorized MAC address"); macInput.setSingleLine(true);
                  root.addView(macInput);

                  Button connect=new Button(this);
                  connect.setText("CONNECT"); root.addView(connect);

                  status=new TextView(this);
                  status.setPadding(0,16,0,16); root.addView(status);

                  ScrollView sv=new ScrollView(this);
                  list=new LinearLayout(this); list.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(list);
                  root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));
                  connect.setOnClickListener(v->connect());
                  setContentView(root);
              }

              void connect() {
                  String portal=portalInput.getText().toString().trim();
                  mac=macInput.getText().toString().trim().toUpperCase();
                  if(portal.isEmpty()||mac.isEmpty()){status.setText("Portal and authorized MAC are required.");return;}
                  if(!mac.matches("([0-9A-F]{2}:){5}[0-9A-F]{2}")){status.setText("Invalid MAC format.");return;}
                  new Thread(()->{
                      try {
                          post("Connecting...");
                          workingPortal=normalize(portal);
                          JSONObject h=getJson(workingPortal+"?type=stb&action=handshake&JsHttpRequest=1-xml&mac="+enc(mac));
                          JSONObject js=h.optJSONObject("js");
                          if(js==null||!js.has("token"))throw new Exception("Handshake failed");
                          token=js.optString("token","");
                          if(token.startsWith("~"))token=token.substring(1);
                          getJson(workingPortal+"?type=account_info&action=get_main_info&JsHttpRequest=1-xml");
                          getChannels();
                      } catch(Exception e){post("Error: "+e.getMessage());}
                  }).start();
              }

              void getChannels() throws Exception {
                  JSONObject d=getJson(workingPortal+"?type=itv&action=get_all_channels&JsHttpRequest=1-xml");
                  JSONObject js=d.optJSONObject("js");
                  JSONArray a=js==null?null:js.optJSONArray("data");
                  if(a==null){post("Connected, but no channels returned.");return;}
                  runOnUiThread(()->{
                      list.removeAllViews(); status.setText("Connected — "+a.length()+" channels");
                      for(int n=0;n<a.length();n++){
                          JSONObject ch=a.optJSONObject(n); if(ch==null)continue;
                          String name=ch.optString("name","Channel"), id=ch.optString("id","");
                          Button x=new Button(this); x.setText(name); x.setAllCaps(false);
                          x.setOnClickListener(v->play(id)); list.addView(x);
                      }
                  });
              }

              void play(String id) {
                  new Thread(()->{
                      try {
                          String q=workingPortal+"?type=itv&action=create_link&JsHttpRequest=1-xml&cmd="+enc("ffmpeg http://localhost/ch/"+id);
                          JSONObject d=getJson(q), js=d.optJSONObject("js");
                          String u="";
                          if(js!=null){u=js.optString("cmd","");if(u.isEmpty())u=js.optString("url","");if(u.isEmpty())u=js.optString("link","");}
                          if(u.isEmpty())throw new Exception("No stream URL returned");
                          u=u.replaceFirst("^(ffmpeg|vlc)\s+","").trim();
                          String finalU=u;
                          runOnUiThread(()->{
                              try{Intent i=new Intent(Intent.ACTION_VIEW, Uri.parse(finalU));i.setType("video/*");startActivity(i);}
                              catch(Exception e){Toast.makeText(this,"No video player installed.",Toast.LENGTH_LONG).show();}
                          });
                      }catch(Exception e){post("Playback error: "+e.getMessage());}
                  }).start();
              }

              JSONObject getJson(String s)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(s).openConnection();
                  c.setConnectTimeout(10000);c.setReadTimeout(15000);c.setRequestMethod("GET");
                  c.setRequestProperty("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");
                  c.setRequestProperty("X-User-Agent","Model: MAG250; Link: WiFi");
                  c.setRequestProperty("Accept","*/*");
                  c.setRequestProperty("Referer","http://localhost/stalker_portal/c/");
                  c.setRequestProperty("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");
                  if(!token.isEmpty())c.setRequestProperty("Authorization","Bearer "+token);
                  int code=c.getResponseCode(); if(code!=200)throw new Exception("HTTP "+code);
                  BufferedReader r=new BufferedReader(new InputStreamReader(c.getInputStream()));
                  StringBuilder z=new StringBuilder();String line;
                  while((line=r.readLine())!=null)z.append(line);
                  r.close();c.disconnect();return new JSONObject(z.toString());
              }

              String normalize(String p){p=p.trim();while(p.endsWith("/"))p=p.substring(0,p.length()-1);if(p.endsWith("/portal.php"))return p;if(p.endsWith("/c"))return p+"/portal.php";return p+"/c/portal.php";}
              String enc(String s)throws Exception{return URLEncoder.encode(s,"UTF-8");}
              void post(String s){runOnUiThread(()->status.setText(s));}
          }
          EOF

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StalkerIPTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
