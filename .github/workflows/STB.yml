
name: Build Stalker IPTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      # ---------------- PART 1: Project skeleton, Gradle files, Repository ----------------
      - name: Generate project (part 1 - skeleton + repository)
        run: |
          mkdir -p app/src/main/java/com/stb/iptv
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "stb-iptv"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.0" apply false
          }
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.stb.iptv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stb.iptv"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.3")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.3.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="STB IPTV"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".PlayerActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden"/>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar"/>
          </resources>
          XEOF

          cat > app/src/main/java/com/stb/iptv/Repository.kt <<'XEOF'
          package com.stb.iptv

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.json.*
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.net.URLEncoder

          data class Channel(val id: String, val name: String, val num: Int, val cmd: String)
          data class Vod(val id: String, val name: String, val cmd: String, val type: String)
          data class Episode(val id: String, val name: String, val cmd: String)

          class Repository(private val client: OkHttpClient) {

              private lateinit var base: String
              private lateinit var mac: String
              private var tokenCookie: String = ""
              var expiry: String? = null
                  private set

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8")

              private val portalHeaders = mapOf(
                  "Referer" to "",
                  "X-User-Agent" to "Model: MAG250; Link: WiFi",
                  "User-Agent" to "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3"
              )

              private fun call(type: String, action: String, vararg params: Pair<String, String>): JsonObject {
                  val sb = StringBuilder("$base portal.php?type=$type&action=$action")
                  params.forEach { (k, v) -> sb.append("&").append(k).append("=").append(enc(v)) }
                  sb.append("&JsHttpRequest=1-xml")
                  val rb = Request.Builder().url(sb.toString())
                      .header("Cookie", tokenCookie.ifBlank { "mac=$mac; stb_lang=en; timezone=Europe/London" })
                      .header("Referer", base)
                      .header("X-User-Agent", portalHeaders["X-User-Agent"]!!)
                      .header("User-Agent", portalHeaders["User-Agent"]!!)
                      .get()
                  client.newCall(rb.build()).execute().use { r ->
                      val body = r.body?.string() ?: throw Exception("empty response")
                      return Json.parseToJsonElement(body).jsonObject
                  }
              }

              suspend fun login(url: String, macAddress: String): JsonObject =
                  withContext(Dispatchers.IO) {
                      base = if (url.endsWith("/c/")) url else url.trimEnd('/') + "/c/"
                      mac = macAddress
                      val hs = call("handshake", "get_token")
                      val token = hs["token"]?.jsonPrimitive?.contentOrNull
                          ?: throw Exception("handshake failed")
                      tokenCookie = "mac=$mac; stb_lang=en; timezone=Europe/London; Bearer=$token"
                      val prof = call("profile", "get_profile")
                      expiry = extractExpiry(prof)
                      prof
                  }

              private fun extractExpiry(prof: JsonObject): String? {
                  val candidates = listOfNotNull(
                      prof,
                      prof["account"] as? JsonObject,
                      (prof["results"] as? JsonObject)?.let {
                          (it["account"] as? JsonObject) ?: it
                      },
                      prof["js"] as? JsonObject
                  )
                  for (o in candidates) {
                      for (key in listOf("expire_billing_date", "expire", "expires",
                              "expiration_date", "end_date")) {
                          val v = o[key]?.jsonPrimitive?.contentOrNull ?: continue
                          if (v.isNotBlank() && v != "null") return v
                      }
                  }
                  return null
              }

              private inline fun JsonObject.maxPage(): Int {
                  val mp = this["max_page"]?.jsonPrimitive?.intOrNull
                      ?: this["total_pages"]?.jsonPrimitive?.intOrNull ?: 1
                  return mp.coerceAtLeast(1)
              }

              private inline fun paginate(action: String, type: String,
                                          block: (JsonArray) -> Unit) {
                  var page = 1
                  while (true) {
                      val j = call(type, action, "p" to page.toString())
                      val data = j["data"]?.jsonArray ?: break
                      if (data.isEmpty()) break
                      block(data)
                      if (page >= j.maxPage()) break
                      page++
                      Thread.sleep(150)
                  }
              }

              // FULL channel list — all pages
              suspend fun allChannels(): List<Channel> = withContext(Dispatchers.IO) {
                  val out = mutableListOf<Channel>()
                  paginate("get_all_channels", "itv") { data ->
                      for (ch in data) {
                          val o = ch.jsonObject
                          val cmd = o["cmd"]?.jsonPrimitive?.contentOrNull ?: continue
                          out.add(Channel(
                              id = o["id"]?.jsonPrimitive?.content ?: "",
                              name = o["name"]?.jsonPrimitive?.content ?: "",
                              num = o["number"]?.jsonPrimitive?.intOrNull ?: 0,
                              cmd = cmd))
                      }
                  }
                  out
              }

              // FULL VOD + series list — all pages
              suspend fun allVod(): List<Vod> = withContext(Dispatchers.IO) {
                  val out = mutableListOf<Vod>()
                  paginate("get_ordered_list", "vod") { data ->
                      for (v in data) {
                          val o = v.jsonObject
                          val isSeries = o["cmd"] == null ||
                              o["series"]?.jsonArray?.isNotEmpty() == true
                          out.add(Vod(
                              id = o["id"]?.jsonPrimitive?.content ?: "",
                              name = o["name"]?.jsonPrimitive?.content ?: "",
                              cmd = o["cmd"]?.jsonPrimitive?.contentOrNull ?: "",
                              type = if (isSeries) "series" else "vod"))
                      }
                  }
                  out
              }

              // FULL episode list for a series — all pages, seasons flattened
              suspend fun allEpisodes(seriesId: String): List<Episode> =
                  withContext(Dispatchers.IO) {
                      val out = mutableListOf<Episode>()
                      paginate("get_episodes", "series") { data ->
                          for (e in data) {
                              val o = e.jsonObject
                              val cmd = o["cmd"]?.jsonPrimitive?.contentOrNull ?: continue
                              val season = o["season_number"]?.jsonPrimitive?.intOrNull ?: 1
                              val ep = o["episode_number"]?.jsonPrimitive?.intOrNull
                                  ?: o["num"]?.jsonPrimitive?.intOrNull ?: 0
                              out.add(Episode(
                                  id = o["id"]?.jsonPrimitive?.content ?: "",
                                  name = "S%02d E%02d - %s".format(
                                      season, ep, o["name"]?.jsonPrimitive?.content ?: ""),
                                  cmd = cmd))
                          }
                      }
                      out
                  }

              // create_link for VOD / series / channel playback
              suspend fun createLink(cmd: String, type: String, itemId: String): String =
                  withContext(Dispatchers.IO) {
                      val j = when (type) {
                          "vod" -> call("vod", "create_link", "cmd" to cmd)
                          "series" -> call("vod", "create_link", "cmd" to cmd,
                              "series_id" to itemId)
                          else -> call("itv", "create_link", "cmd" to cmd)
                      }
                      val js = j["js"] as? JsonObject
                      (js?.get("cmd")?.jsonPrimitive?.contentOrNull ?: j["cmd"]
                          ?.jsonPrimitive?.contentOrNull
                          ?: throw Exception("no link returned"))
                  }

              // convert cmd to direct URL
              fun toUrl(cmd: String): String = when {
                  cmd.startsWith("ffmpeg ") ->
                      cmd.removePrefix("ffmpeg ").trim().split(" ").last()
                  cmd.startsWith("http") -> cmd
                  else -> throw Exception("unsupported cmd: $cmd")
              }
          }
          XEOF

          echo "part 1 done"

      # ---------------- PART 2: MainActivity (login, channels, VOD, series UI) ----------------
      - name: Generate project (part 2 - main UI)
        run: |
          cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'XEOF'
          package com.stb.iptv

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.*
          import kotlinx.coroutines.Dispatchers

          class MainActivity : ComponentActivity() {
              private val scope = CoroutineScope(Dispatchers.Main)
              private lateinit var repo: Repository

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  repo = Repository(okhttp3.OkHttpClient())
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { App() } }
              }

              @Composable
              private fun App() {
                  var portalUrl by remember { mutableStateOf("") }
                  var mac by remember { mutableStateOf("00:1A:79:00:00:00") }
                  var loggedIn by remember { mutableStateOf(false) }
                  var loading by remember { mutableStateOf(false) }
                  var error by remember { mutableStateOf<String?>(null) }
                  var expiry by remember { mutableStateOf<String?>(null) }
                  var channels by remember { mutableStateOf<List<Channel>>(emptyList()) }
                  var vods by remember { mutableStateOf<List<Vod>>(emptyList()) }
                  var tab by remember { mutableIntStateOf(0) } // 0=tv 1=vod 2=series
                  var dialogEpisodes by remember { mutableStateOf<String?>(null) }
                  var eps by remember { mutableStateOf<List<Episode>>(emptyList()) }

                  if (!loggedIn) {
                      Column(Modifier.fillMaxSize().background(Color(0xFF101018))
                          .padding(24.dp),
                          verticalArrangement = Arrangement.Center) {
                          OutlinedTextField(portalUrl, { portalUrl = it },
                              label = { Text("Portal URL (http://host/c)") },
                              modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(mac, { mac = it },
                              label = { Text("MAC address") },
                              modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(12.dp))
                          Button(
                              onClick = {
                                  val s = scope
                                  loading = true; error = null
                                  s.launch {
                                      try {
                                          val p = repo.login(portalUrl, mac)
                                          expiry = repo.expiry
                                          channels = repo.allChannels()
                                          vods = repo.allVod()
                                          loggedIn = true
                                      } catch (e: Exception) {
                                          error = e.message
                                      } finally { loading = false }
                                  }
                              },
                              enabled = !loading && portalUrl.isNotBlank(),
                              modifier = Modifier.fillMaxWidth()) {
                              Text(if (loading) "Loading..." else "Login")
                          }
                          error?.let { Text(it, color = Color.Red, fontSize = 12.sp) }
                      }
                      return
                  }

                  Column(Modifier.fillMaxSize().background(Color(0xFF101018))
                      .padding(12.dp)) {
                      Text("Expires: ${expiry ?: "unknown"}",
                          color = Color(0xFF8BC34A), fontSize = 13.sp)
                      Row {
                          listOf("TV (${channels.size})", "VOD (${
                              vods.count { it.type == "vod" }})", "Series (${
                              vods.count { it.type == "series" }})").forEachIndexed { i, t ->
                              TextButton(onClick = { tab = i }) {
                                  Text(t, color = if (tab == i) Color(0xFFFFC107)
                                      else Color.White)
                              }
                          }
                      }

                      if (tab == 0) {
                          LazyColumn {
                              items(channels) { ch ->
                                  Text("${ch.num}. ${ch.name}", color = Color.White,
                                      modifier = Modifier.fillMaxWidth()
                                          .clickable {
                                              scope.launch {
                                                  loading = true
                                                  try {
                                                      val link = repo.createLink(
                                                          ch.cmd, "itv", ch.id)
                                                      playUrl(repo.toUrl(link), ch.name)
                                                  } catch (e: Exception) {
                                                      error = e.message
                                                  } finally { loading = false }
                                              }
                                          }
                                          .padding(vertical = 8.dp))
                              }
                          }
                      } else {
                          val list = vods.filter { it.type ==
                              if (tab == 1) "vod" else "series" }
                          LazyColumn {
                              items(list) { v ->
                                  Text(v.name, color = Color.White,
                                      modifier = Modifier.fillMaxWidth()
                                          .clickable {
                                              if (v.type == "vod") {
                                                  scope.launch {
                                                      loading = true
                                                      try {
                                                          val link = repo.createLink(
                                                              v.cmd, "vod", v.id)
                                                          playUrl(repo.toUrl(link), v.name)
                                                      } catch (e: Exception) {
                                                          error = e.message
                                                      } finally { loading = false }
                                                  }
                                              } else {
                                                  scope.launch {
                                                      loading = true
                                                      try {
                                                          eps = repo.allEpisodes(v.id)
                                                          dialogEpisodes = v.name
                                                      } catch (e: Exception) {
                                                          error = e.message
                                                      } finally { loading = false }
                                                  }
                                              }
                                          }
                                          .padding(vertical = 8.dp))
                              }
                          }
                      }

                      error?.let { Text(it, color = Color.Red, fontSize = 12.sp) }

                      dialogEpisodes?.let { seriesName ->
                          AlertDialog(onDismissRequest = { dialogEpisodes = null },
                              title = { Text(seriesName, color = Color.White) },
                              text = {
                                  LazyColumn(Modifier.height(340.dp)) {
                                      items(eps) { ep ->
                                          Text(ep.name, color = Color.White,
                                              modifier = Modifier.fillMaxWidth()
                                                  .clickable {
                                                      dialogEpisodes = null
                                                      scope.launch {
                                                          loading = true
                                                          try {
                                                              val link = repo.createLink(
                                                                  ep.cmd, "series", ep.id)
                                                              playUrl(repo.toUrl(link), ep.name)
                                                          } catch (e: Exception) {
                                                              error = e.message
                                                          } finally { loading = false }
                                                      }
                                                  }
                                                  .padding(vertical = 8.dp))
                                      }
                                  }
                              },
                              confirmButton = {
                                  TextButton(onClick = { dialogEpisodes = null }) {
                                      Text("Close") }
                              })
                      }
                  }
              }

              private fun playUrl(url: String, title: String) {
                  val i = Intent(this, PlayerActivity::class.java)
                  i.putExtra("url", url); i.putExtra("title", title)
                  startActivity(i)
              }
          }
          XEOF

          echo "part 2 done"

      # ---------------- PART 3: PlayerActivity ----------------
      - name: Generate project (part 3 - player)
        run: |
          cat > app/src/main/java/com/stb/iptv/PlayerActivity.kt <<'XEOF'
          package com.stb.iptv

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.okhttp.OkHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView

          class PlayerActivity : ComponentActivity() {
              private var player: ExoPlayer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val url = intent.getStringExtra("url") ?: ""
                  val title = intent.getStringExtra("title") ?: "Stream"
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          PlayerScreen(url, title)
                      }
                  }
              }

              @Composable
              private fun PlayerScreen(url: String, title: String) {
                  var errorMsg by remember { mutableStateOf<String?>(null) }
                  Box(Modifier.fillMaxSize().background(Color.Black)) {
                      AndroidView(modifier = Modifier.fillMaxSize(), factory = { c ->
                          PlayerView(c).apply {
                              useController = true
                              val ds = OkHttpDataSource.Factory(
                                  okhttp3.OkHttpClient())
                                  .setUserAgent("Mozilla/5.0 (QtEmbedded; U; " +
                                      "Linux; C) AppleWebKit/533.3 (KHTML, like " +
                                      "Gecko) MAG200 stbapp ver: 2 rev: 250 " +
                                      "Safari/533.3")
                              val exo = ExoPlayer.Builder(c)
                                  .setMediaSourceFactory(DefaultMediaSourceFactory(ds))
                                  .setSeekBackIncrementMs(10000)
                                  .setSeekForwardIncrementMs(10000)
                                  .build()
                              player = exo
                              exo.setMediaItem(MediaItem.Builder()
                                  .setUri(url)
                                  .setMediaMetadata(MediaMetadata.Builder()
                                      .setTitle(title).build())
                                  .build())
                              exo.addListener(object : Player.Listener {
                                  override fun onPlayerError(e: PlaybackException) {
                                      errorMsg = e.errorCodeName + ": " +
                                          (e.message ?: "unknown")
                                  }
                              })
                              exo.prepare()
                              exo.playWhenReady = true
                          }
                      })
                      Text(title, color = Color.White, modifier = Modifier
                          .align(Alignment.TopStart).padding(12.dp))
                      errorMsg?.let {
                          Text(it, color = Color.Red, modifier = Modifier
                              .align(Alignment.Center).padding(16.dp))
                      }
                      DisposableEffect(Unit) {
                          onDispose { player?.release(); player = null }
                      }
                  }
              }

              override fun onStop() { super.onStop(); player?.pause() }
              override fun onDestroy() {
                  player?.release(); player = null; super.onDestroy()
              }
          }
          XEOF

          echo "project generated"

      - name: Build debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew --no-daemon assembleDebug
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
          fi
