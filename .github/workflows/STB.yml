name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/stb/iptv \
                   app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.stb.iptv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stb.iptv"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "3.1"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-exoplayer-rtsp:1.4.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.4.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="STB Player Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App">
                  <activity android:name=".PlayerActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize"
                      android:exported="false" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B1020</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/res/drawable/bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="270" android:startColor="#0B1020"
                  android:centerColor="#101A33" android:endColor="#0B1020" />
          </shape>
          XEOF

                    cat > app/src/main/java/com/stb/iptv/StalkerRepository.kt <<'XEOF'
          package com.stb.iptv

          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          data class Session(val portal: String, val token: String, val mac: String)
          data class MediaItem(val id: String, val name: String, val type: String,
                               val group: String = "", val cmd: String = "")
          data class PagedResult(val items: List<MediaItem>, val page: Int,
                                 val totalPages: Int)

          class StalkerRepository {
              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS).build()

              private val ua = "Mozilla/5.0 (QtEmbedded; U; Linux; C) " +
                  "AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 " +
                  "rev: 250 Safari/533.3"

              fun normalizeMac(raw: String): String? {
                  val v = raw.filter { it.isDigit() || it.uppercaseChar() in 'A'..'F' }
                      .uppercase()
                  return if (v.length == 12) v.chunked(2).joinToString(":") else null
              }

              fun baseUrl(portal: String): String =
                  Regex("^(https?://[^/]+)").find(portal.trim())
                      ?.groupValues?.get(1) ?: portal.trim().trimEnd('/')

              private fun urls(portal: String) = portal.trim().trimEnd('/').let { c ->
                  if (c.endsWith("/portal.php")) listOf(c) else listOf(
                      "$c/c/portal.php", "$c/portal.php", "$c/server/load.php"
                  ).distinct()
              }

              fun call(url: String, params: Map<String, String>, s: Session? = null): JSONObject {
                  val u = url.toHttpUrl().newBuilder().apply {
                      params.forEach { (k, v) -> addQueryParameter(k, v) }
                  }.build()
                  val rb = Request.Builder().url(u)
                      .header("User-Agent", ua)
                      .header("X-User-Agent", "Model: MAG254; Link: Ethernet")
                      .header("Accept", "*/*")
                  if (s != null) {
                      rb.header("Authorization", "Bearer ${s.token}")
                      rb.header("Cookie", "mac=${s.mac}; stb_lang=en; timezone=UTC")
                  }
                  http.newCall(rb.build()).execute().use { r ->
                      val body = r.body?.string().orEmpty()
                      if (!r.isSuccessful || body.isBlank()) throw IOException("HTTP ${r.code}")
                      return JSONObject(body)
                  }
              }

              fun connect(portal: String, rawMac: String): Session {
                  val mac = normalizeMac(rawMac)
                      ?: throw IllegalArgumentException("Invalid MAC")
                  var last: Exception = IOException("handshake failed")
                  for (u in urls(portal)) {
                      try {
                          val js = call(u, mapOf(
                              "type" to "stb", "action" to "handshake", "token" to "",
                              "JsHttpRequest" to "1-xml", "mac" to mac)
                          ).optJSONObject("js")
                          val tok = js?.optString("token").orEmpty()
                              .substringBefore("~").trim()
                          if (tok.isNotEmpty()) return Session(u, tok, mac)
                      } catch (e: Exception) { last = e }
                  }
                  throw last
              }

              private fun profile(s: Session): JSONObject = try {
                  call(s.portal, mapOf("type" to "stb", "action" to "get_profile",
                      "JsHttpRequest" to "1-xml"), s).optJSONObject("js") ?: JSONObject()
              } catch (e: Exception) { JSONObject() }

              fun expiry(s: Session): String {
                  val keys = listOf("expire_billing_date", "expire_date", "expire",
                      "expire_at", "end_date", "end_time", "valid_to", "expired")
                  val sources = mutableListOf(profile(s))
                  for (p in listOf(
                      mapOf("type" to "account_info", "action" to "get_main_info"),
                      mapOf("type" to "account_info", "action" to "get_account_info"))) {
                      try {
                          call(s.portal, p + mapOf("JsHttpRequest" to "1-xml"),
                              s).optJSONObject("js")?.let { sources.add(it) }
                      } catch (_: Exception) {}
                  }
                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  for (js in sources) {
                      for (obj in listOfNotNull(js, js.optJSONObject("account"),
                              js.optJSONObject("data"))) {
                          for (k in keys) {
                              if (!obj.has(k)) continue
                              val v = obj.optString(k).trim()
                              if (v.isEmpty() || v == "0" || v == "null" || v == "-1" ||
                                  v.startsWith("0000")) continue
                              if (v.matches(Regex("\\d{9,13}"))) {
                                  var ts = v.toLong()
                                  if (ts > 100000000000L) ts /= 1000
                                  if (ts < 100000000L) continue
                                  val d = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US)
                                      .format(Date(ts * 1000))
                                  return if (ts * 1000 < System.currentTimeMillis())
                                      "$d (EXPIRED)" else d
                              }
                              if (v.length >= 10) {
                                  val d = v.substring(0, 10)
                                  return if (d < today) "$d (EXPIRED)" else d
                              }
                          }
                      }
                  }
                  return "unlimited / unknown"
              }

              private fun paged(s: Session, type: String, action: String, page: Int = 1,
                                search: String = "", genre: String = "0",
                                extra: Map<String, String> = emptyMap()): PagedResult {
                  val p = mutableMapOf("type" to type, "action" to action,
                      "JsHttpRequest" to "1-xml", "p" to page.toString(),
                      "genre" to genre, "fav" to "0")
                  if (search.isNotBlank()) p["search"] = search
                  p.putAll(extra)
                  val json = try { call(s.portal, p, s) } catch (e: Exception) {
                      return PagedResult(emptyList(), page, 1) }
                  val js = json.optJSONObject("js")
                      ?: return PagedResult(emptyList(), page, 1)
                  val arr = js.optJSONArray("data")
                      ?: return PagedResult(emptyList(), page, 1)
                  val out = mutableListOf<MediaItem>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val id = o.optString("id").ifBlank {
                          o.optString("ch_id").ifBlank { o.optString("series_id") } }
                      if (id.isBlank()) continue
                      var nm = o.optString("name").ifBlank { o.optString("title") }
                          .ifBlank { o.optString("o_name") }
                      val num = o.optString("num")
                      if (nm.isBlank() && num.isNotBlank()) nm = "Episode $num"
                      if (nm.isBlank()) nm = "Untitled"
                      out.add(MediaItem(id, nm, type, o.optString("tv_genre_id", ""),
                          o.optString("cmd", "")))
                  }
                  val tp = if (js.has("total_pages")) js.optInt("total_pages", 1)
                           else js.optInt("max_page", 1)
                  return PagedResult(out.distinctBy { it.id }, page,
                      if (tp < 1) 1 else tp)
              }

              fun live(s: Session): List<MediaItem> =
                  paged(s, "itv", "get_all_channels",
                      extra = mapOf("force_all" to "1")).items.ifEmpty {
                  paged(s, "itv", "get_ordered_list",
                      extra = mapOf("sortby" to "number")).items.ifEmpty {
                      var pg = 1; val acc = mutableListOf<MediaItem>()
                      while (pg < 40) {
                          val r = paged(s, "itv", "get_ordered_list", pg,
                              extra = mapOf("sortby" to "number"))
                          if (r.items.isEmpty()) break
                          acc += r.items; pg++
                      }
                      acc
                  }
              }

              fun vod(s: Session, page: Int = 1, search: String = "") =
                  paged(s, "vod", "get_ordered_list", page, search)

              fun series(s: Session, page: Int = 1, search: String = "") =
                  paged(s, "series", "get_ordered_list", page, search)

              fun episodes(s: Session, seriesId: String): List<MediaItem> {
                  val out = mutableListOf<MediaItem>()
                  var pg = 1; var tp = 1
                  while (pg <= tp && pg <= 25) {
                      val r = paged(s, "series", "get_series", pg,
                          extra = mapOf("series_id" to seriesId,
                              "sortby" to "number"))
                      if (r.items.isEmpty()) break
                      out += r.items
                      tp = r.totalPages
                      pg++
                  }
                  return out.map { it.copy(type = "vod") }
              }

              fun stream(s: Session, it: MediaItem): String {
                  val base = baseUrl(s.portal)
                  if (it.type == "itv") {
                      return "$base/play/live.php?mac=${s.mac}&stream=${it.id}" +
                          "&extension=ts&play_token=${s.token}"
                  }
                  Regex("https?://\\S+").find(it.cmd)?.value
                      ?.let { return rewrite(it, s) }
                  if (it.cmd.isNotBlank()) {
                      for (t in listOf(it.type, "vod").distinct()) {
                          try {
                              val js = call(s.portal, mapOf(
                                  "type" to t, "action" to "create_link",
                                  "JsHttpRequest" to "1-xml",
                                  "cmd" to it.cmd,
                                  "forced_storage" to "undefined",
                                  "disable_ad" to "0"), s
                              ).optJSONObject("js")
                              var u = js?.optString("cmd", js.optString("url")).orEmpty()
                              if (u.isNotBlank()) {
                                  u = u.replace(Regex(
                                      "^(ffrt\\d*\\s+|ffmpeg\\s+|mpv\\s+|http\\s+)"),
                                      "").trim()
                                  if (u.startsWith("http")) return rewrite(u, s)
                              }
                          } catch (_: Exception) {}
                      }
                  }
                  return if (it.type == "series")
                      "$base/play/series.php?mac=${s.mac}&stream=${it.id}" +
                          "&extension=mp4&play_token=${s.token}"
                  else
                      "$base/play/vod.php?mac=${s.mac}&stream=${it.id}" +
                          "&extension=mp4&play_token=${s.token}"
              }

              private fun rewrite(u: String, s: Session): String {
                  val host = Regex("https?://([^/]+)").find(s.portal)
                      ?.groupValues?.get(1) ?: return u
                  return if (Regex("^https?://(portal|127\\.0\\.0\\.1|localhost)")
                      .containsMatchIn(u))
                      u.replaceFirst(Regex("^(https?://)[^/]+"), "$1$host") else u
              }
          }
          XEOF

          cat > app/src/main/java/com/stb/iptv/MacScanner.kt <<'XEOF'
          package com.stb.iptv

          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CountDownLatch
          import kotlin.random.Random

          data class Hit(val mac: String, val expiry: String)

          object MacScanner {
              fun scan(repo: StalkerRepository, portal: String, prefix: String,
                       count: Int, threads: Int, onHit: (Hit) -> Unit,
                       onDone: (Int) -> Unit) {
                  val macs = ConcurrentLinkedQueue<String>()
                  repeat(count) {
                      macs.add("$prefix:%02X:%02X:%02X".format(
                          Random.nextInt(256), Random.nextInt(256),
                          Random.nextInt(256)))
                  }
                  val latch = CountDownLatch(threads)
                  repeat(threads) {
                      Thread {
                          while (true) {
                              val mac = macs.poll() ?: break
                              try {
                                  val s = repo.connect(portal, mac)
                                  onHit(Hit(s.mac, repo.expiry(s)))
                              } catch (_: Exception) {}
                          }
                          latch.countDown()
                      }.start()
                  }
                  Thread { latch.await(); onDone(count - macs.size) }.start()
              }
          }
          XEOF

                    cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'XEOF'
          package com.stb.iptv

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          val Bg1 = Color(0xFF0B1020); val Bg2 = Color(0xFF101A33)
          val Accent = Color(0xFF22C55E)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(
                          primary = Accent, background = Bg1, surface = Bg1)) {
                          Surface(Modifier.fillMaxSize()) {
                              Column(Modifier.fillMaxSize().background(Brush
                                  .verticalGradient(listOf(Bg1, Bg2, Bg1)))) {
                                  MainScreen()
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun MainScreen() {
              val repo = remember { StalkerRepository() }
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()

              var portal by remember { mutableStateOf("") }
              var mac by remember { mutableStateOf("") }
              var prefix by remember { mutableStateOf("00:1A:79") }
              var count by remember { mutableStateOf("50") }
              var status by remember { mutableStateOf("idle") }
              var error by remember { mutableStateOf<String?>(null) }
              var loading by remember { mutableStateOf(false) }
              var tab by remember { mutableStateOf(0) }
              var search by remember { mutableStateOf("") }
              var jump by remember { mutableStateOf("") }
              var session by remember { mutableStateOf<Session?>(null) }
              var expiryInfo by remember { mutableStateOf("") }
              var items by remember { mutableStateOf(listOf<MediaItem>()) }
              var hits by remember { mutableStateOf(listOf<Hit>()) }
              var page by remember { mutableStateOf(1) }
              var totalPages by remember { mutableStateOf(1) }
              var dialogTitle by remember { mutableStateOf("") }
              var dialogEpisodes by remember { mutableStateOf<List<MediaItem>?>(null) }

              fun load(p: Int) {
                  val s = session ?: return
                  scope.launch {
                      loading = true; error = null
                      try {
                          if (tab == 0) {
                              items = withContext(Dispatchers.IO) { repo.live(s) }
                              page = 1; totalPages = 1
                              status = "${items.size} live channels"
                          } else {
                              val r = withContext(Dispatchers.IO) {
                                  if (tab == 1) repo.vod(s, p, search.trim())
                                  else repo.series(s, p, search.trim())
                              }
                              items = r.items; page = r.page; totalPages = r.totalPages
                              status = (if (tab == 1) "VOD" else "Series") +
                                  " - page $page / $totalPages" +
                                  if (items.isEmpty()) " (no items)" else ""
                          }
                      } catch (e: Exception) { error = e.message }
                      finally { loading = false }
                  }
              }

              fun playUrl(url: String, name: String) {
                  if (url.isBlank())
                      throw IllegalStateException("could not resolve stream URL")
                  ctx.startActivity(Intent(ctx, PlayerActivity::class.java)
                      .apply { putExtra("url", url)
                               putExtra("title", name) })
                  status = "playing $name"
              }

              fun openItem(item: MediaItem) {
                  val s = session ?: return
                  scope.launch {
                      loading = true; error = null
                      status = "opening ${item.name}..."
                      try {
                          if (item.type == "series") {
                              val eps = withContext(Dispatchers.IO) {
                                  repo.episodes(s, item.id) }
                              if (eps.isEmpty())
                                  throw IllegalStateException("no episodes found")
                              dialogTitle = item.name
                              dialogEpisodes = eps
                          } else {
                              val url = withContext(Dispatchers.IO) {
                                  repo.stream(s, item) }
                              playUrl(url, item.name)
                          }
                      } catch (e: Exception) { error = e.message }
                      finally { loading = false }
                  }
              }

              fun connect() {
                  scope.launch {
                      loading = true; error = null; status = "connecting..."
                      try {
                          val s = withContext(Dispatchers.IO) {
                              repo.connect(portal, mac) }
                          val exp = withContext(Dispatchers.IO) { repo.expiry(s) }
                          session = s
                          expiryInfo = exp
                          tab = 0; search = ""; page = 1; totalPages = 1
                          status = "connected: ${s.mac}"
                          load(1)
                      } catch (e: Exception) { error = e.message }
                      finally { loading = false }
                  }
              }

              fun scan() {
                  scope.launch {
                      loading = true; hits = emptyList(); error = null
                      status = "scanning..."
                      withContext(Dispatchers.IO) {
                          MacScanner.scan(repo, portal, prefix,
                              count.toIntOrNull() ?: 50, 8,
                              onHit = { h -> scope.launch { hits = hits + h } },
                              onDone = { n -> scope.launch {
                                  status = "scan done: $n hits"; loading = false } })
                      }
                  }
              }

              Column(Modifier.fillMaxSize().padding(14.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("STB Player Pro", style = MaterialTheme.typography
                      .headlineSmall, color = Accent)
                  Text(status, color = Color(0xFF8A8F98),
                      style = MaterialTheme.typography.bodySmall)
                  if (expiryInfo.isNotEmpty()) Text("Expiry: $expiryInfo",
                      color = Accent, style = MaterialTheme.typography.bodySmall)
                  error?.let { Text(it, color = MaterialTheme.colorScheme.error) }

                  OutlinedTextField(portal, { portal = it },
                      label = { Text("Portal URL") },
                      modifier = Modifier.fillMaxWidth(), singleLine = true)
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(mac, { mac = it }, label = { Text("MAC") },
                          modifier = Modifier.weight(1f), singleLine = true)
                      Button({ connect() }, enabled = !loading,
                          modifier = Modifier.height(56.dp)) { Text("Connect") }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(prefix, { prefix = it },
                          label = { Text("Prefix") },
                          modifier = Modifier.weight(1f), singleLine = true)
                      OutlinedTextField(count, { count = it },
                          label = { Text("Count") },
                          modifier = Modifier.weight(1f), singleLine = true)
                      Button({ scan() }, enabled = !loading,
                          modifier = Modifier.height(56.dp)) { Text("Scan") }
                  }

                  if (hits.isNotEmpty()) {
                      Text("Active MACs (tap = load):", color = Accent,
                          style = MaterialTheme.typography.labelMedium)
                      LazyColumn(Modifier.height(120.dp)) {
                          items(hits) { h ->
                              Text("${h.mac}  (${h.expiry})", color = Color.White,
                                  modifier = Modifier.fillMaxWidth()
                                      .clickable { mac = h.mac; connect() }
                                      .padding(vertical = 6.dp))
                          }
                      }
                  }

                  Row(Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("Live", "VOD", "Series").forEachIndexed { i, label ->
                          FilterChip(selected = tab == i,
                              onClick = {
                                  tab = i; search = ""; page = 1; totalPages = 1
                                  load(1)
                              },
                              label = { Text(label) },
                              modifier = Modifier.weight(1f))
                      }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(search, { search = it },
                          label = { Text("Search") },
                          modifier = Modifier.weight(1f), singleLine = true)
                      Button({ load(1) }, enabled = session != null && !loading) {
                          Text("Go") }
                  }

                  if (tab != 0) {
                      Row(Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          Button({ load(page - 1) },
                              enabled = page > 1 && !loading) { Text("Prev") }
                          Text("Page $page / $totalPages",
                              modifier = Modifier.weight(1f),
                              textAlign = TextAlign.Center, color = Color.White)
                          Button({ load(page + 1) },
                              enabled = page < totalPages && !loading) { Text("Next") }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(jump, { jump = it },
                              label = { Text("Jump to page") },
                              modifier = Modifier.weight(1f), singleLine = true)
                          Button({
                              load((jump.toIntOrNull() ?: 1)
                                  .coerceIn(1, maxOf(1, totalPages)))
                          }, enabled = session != null && !loading) { Text("Go") }
                      }
                  }

                  val shown = if (tab == 0)
                      items.filter { it.name.contains(search, true) } else items

                  LazyColumn(Modifier.weight(1f),
                      verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      items(shown) { item ->
                          Card(Modifier.fillMaxWidth()
                              .clickable { openItem(item) }) {
                              Text(item.name, Modifier.padding(14.dp),
                                  color = Color.White)
                          }
                      }
                  }
              }

              dialogEpisodes?.let { eps ->
                  AlertDialog(
                      onDismissRequest = { dialogEpisodes = null },
                      confirmButton = {
                          TextButton(onClick = { dialogEpisodes = null }) {
                              Text("Close") }
                      },
                      title = { Text(dialogTitle, color = Color.White) },
                      text = {
                          LazyColumn(Modifier.height(340.dp)) {
                              items(eps) { ep ->
                                  Text(ep.name, color = Color.White,
                                      modifier = Modifier.fillMaxWidth()
                                          .clickable {
                                              dialogEpisodes = null
                                              val s = session ?: return@clickable
                                              scope.launch {
                                                  loading = true; error = null
                                                  try {
                                                      val url = withContext(
                                                          Dispatchers.IO) {
                                                          repo.stream(s, ep) }
                                                      playUrl(url, ep.name)
                                                  } catch (e: Exception) {
                                                      error = e.message
                                                  }
                                                  finally { loading = false }
                                              }
                                          }
                                          .padding(vertical = 8.dp))
                              }
                          }
                      }
                  )
              }
          }
          XEOF

          cat > app/src/main/java/com/stb/iptv/PlayerActivity.kt <<'XEOF'
          package com.stb.iptv

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.okhttp.OkHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView

          class PlayerActivity : ComponentActivity() {
              private var player: ExoPlayer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val url = intent.getStringExtra("url") ?: ""
                  val title = intent.getStringExtra("title") ?: "Stream"
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          PlayerScreen(url, title)
                      }
                  }
              }

              @Composable
              private fun PlayerScreen(url: String, title: String) {
                  var errorMsg by remember { mutableStateOf<String?>(null) }
                  Box(Modifier.fillMaxSize().background(Color.Black)) {
                      AndroidView(modifier = Modifier.fillMaxSize(), factory = { c ->
                          PlayerView(c).apply {
                              useController = true
                              val ds = OkHttpDataSource.Factory(
                                  okhttp3.OkHttpClient())
                                  .setUserAgent("Mozilla/5.0 (QtEmbedded; U; " +
                                      "Linux; C) AppleWebKit/533.3 (KHTML, like " +
                                      "Gecko) MAG200 stbapp ver: 2 rev: 250 " +
                                      "Safari/533.3")
                              val exo = ExoPlayer.Builder(c)
                                  .setMediaSourceFactory(DefaultMediaSourceFactory(ds))
                                  .setSeekBackIncrementMs(10000)
                                  .setSeekForwardIncrementMs(10000)
                                  .build()
                              player = exo
                              exo.setMediaItem(MediaItem.Builder()
                                  .setUri(url)
                                  .setMediaMetadata(MediaMetadata.Builder()
                                      .setTitle(title).build())
                                  .build())
                              exo.addListener(object : Player.Listener {
                                  override fun onPlayerError(e: PlaybackException) {
                                      errorMsg = e.errorCodeName + ": " +
                                          (e.message ?: "unknown")
                                  }
                              })
                              exo.prepare()
                              exo.playWhenReady = true
                          }
                      })
                      Text(title, color = Color.White, modifier = Modifier
                          .align(Alignment.TopStart).padding(12.dp))
                      errorMsg?.let {
                          Text(it, color = Color.Red, modifier = Modifier
                              .align(Alignment.Center).padding(16.dp))
                      }
                      DisposableEffect(Unit) {
                          onDispose { player?.release(); player = null }
                      }
                  }
              }

              override fun onStop() { super.onStop(); player?.pause() }
              override fun onDestroy() {
                  player?.release(); player = null; super.onDestroy()
              }
          }
          XEOF

          echo "project generated"

