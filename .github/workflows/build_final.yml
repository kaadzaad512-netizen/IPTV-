name: Build Stalker IPTV Pro APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/stalkeriptv
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # Required by Media3/AndroidX.
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.stalkeriptv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.stalkeriptv'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.8.0'
              implementation 'androidx.media3:media3-ui:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#0A0F1E</color>
              <color name="surface">#121A2B</color>
              <color name="surface2">#1B2740</color>
              <color name="accent">#36D1DC</color>
              <color name="accent2">#5B86E5</color>
              <color name="text">#F5F7FA</color>
              <color name="muted">#9AA7BD</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0A0F1E</item>
                  <item name="android:navigationBarColor">#070B14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:label="Stalker IPTV Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/stalkeriptv/MainActivity.java <<'EOF'
          package com.example.stalkeriptv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import android.graphics.drawable.GradientDrawable;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;

          public class MainActivity extends Activity {

              private static final int BG = Color.rgb(10,15,30);
              private static final int SURFACE = Color.rgb(18,26,43);
              private static final int SURFACE2 = Color.rgb(27,39,64);
              private static final int ACCENT = Color.rgb(54,209,220);
              private static final int BLUE = Color.rgb(91,134,229);
              private static final int TEXT = Color.rgb(245,247,250);
              private static final int MUTED = Color.rgb(154,167,189);

              private LinearLayout root, content;
              private EditText portalEdit, macEdit, searchEdit;
              private TextView status, pageLabel;
              private String workingPortal = "", token = "", mac = "";
              private int mode = 0;
              private int page = 1;
              private ArrayList<JSONObject> currentItems = new ArrayList<>();
              private ExoPlayer player;
              private PlayerView playerView;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(Color.rgb(5,8,15));
                  showLogin();
              }

              private GradientDrawable rounded(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  return g;
              }

              private TextView text(String s, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  return t;
              }

              private Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(TEXT);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  b.setBackground(rounded(SURFACE2, 22));
                  return b;
              }

              private void showLogin() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(26, 28, 26, 24);
                  root.setBackgroundColor(BG);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(0, 50, 0, 20);

                  TextView brand = text("STALKER IPTV", 30, TEXT);
                  brand.setTypeface(null, 1);
                  box.addView(brand);

                  TextView sub = text("Professional IPTV player", 16, MUTED);
                  sub.setPadding(0, 4, 0, 26);
                  box.addView(sub);

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(22, 22, 22, 22);
                  card.setBackground(rounded(SURFACE, 28));

                  portalEdit = new EditText(this);
                  portalEdit.setHint("Portal URL");
                  portalEdit.setTextColor(TEXT);
                  portalEdit.setHintTextColor(MUTED);
                  portalEdit.setSingleLine(true);
                  portalEdit.setPadding(18, 0, 18, 0);
                  portalEdit.setBackground(rounded(SURFACE2, 18));
                  card.addView(portalEdit, new LinearLayout.LayoutParams(-1, 58));

                  macEdit = new EditText(this);
                  macEdit.setHint("Authorized MAC address");
                  macEdit.setTextColor(TEXT);
                  macEdit.setHintTextColor(MUTED);
                  macEdit.setSingleLine(true);
                  macEdit.setPadding(18, 0, 18, 0);
                  macEdit.setBackground(rounded(SURFACE2, 18));
                  LinearLayout.LayoutParams mp = new LinearLayout.LayoutParams(-1, 58);
                  mp.topMargin = 14;
                  card.addView(macEdit, mp);

                  Button connect = button("CONNECT TO PORTAL");
                  connect.setTextSize(15);
                  connect.setBackground(rounded(BLUE, 22));
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1, 58);
                  cp.topMargin = 18;
                  card.addView(connect, cp);

                  status = text("Authorized portal and MAC only.", 13, MUTED);
                  status.setPadding(4, 16, 4, 0);
                  card.addView(status);

                  box.addView(card);

                  TextView features = text(
                          "LIVE  •  VOD  •  SERIES\n\n" +
                          "Search  •  Pagination  •  Built-in Player\n" +
                          "Full-screen playback  •  HLS / DASH",
                          14, MUTED);
                  features.setPadding(4, 28, 4, 0);
                  box.addView(features);

                  scroll.addView(box);
                  root.addView(scroll);
                  setContentView(root);

                  connect.setOnClickListener(v -> connect());
              }

              private void connect() {
                  String portal = portalEdit.getText().toString().trim();
                  mac = macEdit.getText().toString().trim().toUpperCase();

                  if (portal.isEmpty() || mac.isEmpty()) {
                      status.setText("Portal and authorized MAC are required.");
                      return;
                  }

                  if (!mac.matches("([0-9A-F]{2}:){5}[0-9A-F]{2}")) {
                      status.setText("Invalid MAC format.");
                      return;
                  }

                  status.setText("Connecting...");

                  new Thread(() -> {
                      try {
                          workingPortal = normalize(portal);

                          JSONObject handshake = getJson(
                                  workingPortal +
                                  "?type=stb&action=handshake&JsHttpRequest=1-xml&mac=" +
                                  enc(mac));

                          JSONObject js = handshake.optJSONObject("js");

                          if (js == null || !js.has("token")) {
                              throw new Exception("Handshake failed");
                          }

                          token = js.optString("token", "");
                          if (token.startsWith("~")) {
                              token = token.substring(1);
                          }

                          getJson(workingPortal +
                                  "?type=account_info&action=get_main_info&JsHttpRequest=1-xml");

                          runOnUiThread(this::showHome);

                      } catch (Exception e) {
                          runOnUiThread(() ->
                                  status.setText("Connection failed: " + e.getMessage()));
                      }
                  }).start();
              }

              private void showHome() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(18, 8, 12, 8);

                  LinearLayout names = new LinearLayout(this);
                  names.setOrientation(LinearLayout.VERTICAL);

                  TextView title = text("STALKER IPTV PRO", 19, TEXT);
                  title.setTypeface(null, 1);
                  names.addView(title);

                  status = text("Connected", 11, MUTED);
                  names.addView(status);

                  header.addView(names, new LinearLayout.LayoutParams(0, 68, 1));

                  Button exit = button("EXIT");
                  exit.setOnClickListener(v -> {
                      stopPlayer();
                      showLogin();
                  });
                  header.addView(exit, new LinearLayout.LayoutParams(80, 46));

                  root.addView(header);

                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setPadding(10, 5, 10, 5);
                  tabs.setBackgroundColor(Color.rgb(8,13,25));

                  Button live = button("LIVE");
                  Button vod = button("VOD");
                  Button series = button("SERIES");

                  tabs.addView(live, new LinearLayout.LayoutParams(0, 50, 1));
                  tabs.addView(vod, new LinearLayout.LayoutParams(0, 50, 1));
                  tabs.addView(series, new LinearLayout.LayoutParams(0, 50, 1));

                  live.setOnClickListener(v -> switchMode(0));
                  vod.setOnClickListener(v -> switchMode(1));
                  series.setOnClickListener(v -> switchMode(2));

                  root.addView(tabs);

                  LinearLayout searchRow = new LinearLayout(this);
                  searchRow.setPadding(14, 9, 14, 7);

                  searchEdit = new EditText(this);
                  searchEdit.setHint("Search...");
                  searchEdit.setTextColor(TEXT);
                  searchEdit.setHintTextColor(MUTED);
                  searchEdit.setSingleLine(true);
                  searchEdit.setPadding(18, 0, 18, 0);
                  searchEdit.setBackground(rounded(SURFACE, 20));

                  searchRow.addView(searchEdit,
                          new LinearLayout.LayoutParams(0, 52, 1));

                  Button search = button("SEARCH");
                  search.setOnClickListener(v -> draw(currentItems));

                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(105, 52);
                  sp.leftMargin = 8;
                  searchRow.addView(search, sp);

                  root.addView(searchRow);

                  ScrollView scroll = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(14, 6, 14, 10);
                  scroll.addView(content);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout pager = new LinearLayout(this);
                  pager.setGravity(Gravity.CENTER);
                  pager.setPadding(8, 6, 8, 10);

                  Button previous = button("‹");
                  Button next = button("›");
                  pageLabel = text("Page 1", 14, TEXT);
                  pageLabel.setGravity(Gravity.CENTER);

                  pager.addView(previous, new LinearLayout.LayoutParams(70, 48));
                  pager.addView(pageLabel, new LinearLayout.LayoutParams(110, 48));
                  pager.addView(next, new LinearLayout.LayoutParams(70, 48));

                  previous.setOnClickListener(v -> {
                      if (page > 1) {
                          page--;
                          loadMode();
                      }
                  });

                  next.setOnClickListener(v -> {
                      page++;
                      loadMode();
                  });

                  root.addView(pager);
                  setContentView(root);

                  loadMode();
              }

              private void switchMode(int newMode) {
                  mode = newMode;
                  page = 1;
                  loadMode();
              }

              private void loadMode() {
                  pageLabel.setText("Page " + page);
                  status.setText(mode == 0 ? "Loading LIVE..." :
                          mode == 1 ? "Loading VOD..." : "Loading SERIES...");

                  new Thread(() -> {
                      try {
                          ArrayList<JSONObject> result;

                          if (mode == 0) {
                              result = getLive(page);
                          } else if (mode == 1) {
                              result = getVod(page);
                          } else {
                              result = getSeries(page);
                          }

                          currentItems = result;
                          runOnUiThread(() -> draw(result));

                      } catch (Exception e) {
                          runOnUiThread(() ->
                                  status.setText("Load error: " + e.getMessage()));
                      }
                  }).start();
              }

              private void draw(ArrayList<JSONObject> items) {
                  content.removeAllViews();

                  String q = searchEdit == null ?
                          "" : searchEdit.getText().toString().trim().toLowerCase();

                  int count = 0;

                  for (JSONObject item : items) {
                      String name = item.optString(
                              "name",
                              item.optString("title", "Item"));

                      if (!q.isEmpty() &&
                              !name.toLowerCase().contains(q)) {
                          continue;
                      }

                      content.addView(makeCard(item, name));
                      count++;
                  }

                  status.setText(count + " items");
              }

              private View makeCard(JSONObject item, String name) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.HORIZONTAL);
                  card.setGravity(Gravity.CENTER_VERTICAL);
                  card.setPadding(14, 9, 10, 9);
                  card.setBackground(rounded(SURFACE, 22));

                  TextView icon = text(
                          mode == 0 ? "▶" : mode == 1 ? "▣" : "◆",
                          22, ACCENT);
                  icon.setGravity(Gravity.CENTER);

                  card.addView(icon, new LinearLayout.LayoutParams(52, 70));

                  LinearLayout info = new LinearLayout(this);
                  info.setOrientation(LinearLayout.VERTICAL);

                  TextView nameView = text(name, 16, TEXT);
                  nameView.setTypeface(null, 1);
                  info.addView(nameView);

                  String kind = mode == 0 ? "Live channel" :
                          mode == 1 ? "Movie" : "Series";

                  info.addView(text(kind, 12, MUTED));
                  card.addView(info, new LinearLayout.LayoutParams(0, 70, 1));

                  Button action = button(mode == 2 ? "OPEN" : "PLAY");

                  if (mode == 0) {
                      action.setOnClickListener(v -> playLive(item));
                      card.setOnClickListener(v -> playLive(item));
                  } else if (mode == 1) {
                      action.setOnClickListener(v -> playVod(item));
                      card.setOnClickListener(v -> playVod(item));
                  } else {
                      action.setOnClickListener(v -> openSeries(item));
                      card.setOnClickListener(v -> openSeries(item));
                  }

                  card.addView(action, new LinearLayout.LayoutParams(82, 48));

                  FrameLayout wrapper = new FrameLayout(this);
                  wrapper.addView(card,
                          new FrameLayout.LayoutParams(-1, 86));

                  return wrapper;
              }

              private ArrayList<JSONObject> getLive(int page) throws Exception {
                  JSONObject d = getJson(
                          workingPortal +
                          "?type=itv&action=get_all_channels&JsHttpRequest=1-xml");

                  return extractArray(d);
              }

              private ArrayList<JSONObject> getVod(int page) throws Exception {
                  JSONObject d = getJson(
                          workingPortal +
                          "?type=vod&action=get_ordered_list&JsHttpRequest=1-xml" +
                          "&p=" + page + "&items_per_page=30");

                  return extractArray(d);
              }

              private ArrayList<JSONObject> getSeries(int page) throws Exception {
                  JSONObject d = getJson(
                          workingPortal +
                          "?type=series&action=get_ordered_list&JsHttpRequest=1-xml" +
                          "&p=" + page + "&items_per_page=30");

                  return extractArray(d);
              }

              private ArrayList<JSONObject> extractArray(JSONObject d) {
                  ArrayList<JSONObject> out = new ArrayList<>();
                  JSONObject js = d.optJSONObject("js");

                  if (js == null) return out;

                  JSONArray a = js.optJSONArray("data");

                  if (a == null) return out;

                  for (int i = 0; i < a.length(); i++) {
                      JSONObject x = a.optJSONObject(i);
                      if (x != null) out.add(x);
                  }

                  return out;
              }

              private void playLive(JSONObject item) {
                  String id = item.optString("id", "");

                  new Thread(() -> {
                      try {
                          JSONObject d = getJson(
                                  workingPortal +
                                  "?type=itv&action=create_link&JsHttpRequest=1-xml" +
                                  "&cmd=" +
                                  enc("ffmpeg http://localhost/ch/" + id));

                          openStream(extractUrl(d));

                      } catch (Exception e) {
                          runOnUiThread(() ->
                                  status.setText("Playback error: " + e.getMessage()));
                      }
                  }).start();
              }

              private void playVod(JSONObject item) {
                  String id = item.optString(
                          "id", item.optString("movie_id", ""));

                  new Thread(() -> {
                      try {
                          JSONObject d = getJson(
                                  workingPortal +
                                  "?type=vod&action=create_link&JsHttpRequest=1-xml" +
                                  "&movie_id=" + enc(id) +
                                  "&cmd=" +
                                  enc("ffmpeg http://localhost/movie/" + id));

                          openStream(extractUrl(d));

                      } catch (Exception e) {
                          runOnUiThread(() ->
                                  status.setText("Playback error: " + e.getMessage()));
                      }
                  }).start();
              }

              private void openSeries(JSONObject item) {
                  String id = item.optString(
                          "id", item.optString("series_id", ""));

                  new Thread(() -> {
                      try {
                          ArrayList<JSONObject> episodes = getEpisodes(id);

                          runOnUiThread(() ->
                                  showEpisodes(
                                          item.optString("name", "Series"),
                                          episodes));

                      } catch (Exception e) {
                          runOnUiThread(() ->
                                  status.setText("Episode error: " + e.getMessage()));
                      }
                  }).start();
              }

              private ArrayList<JSONObject> getEpisodes(String id) throws Exception {
                  String[] queries = {
                          workingPortal +
                          "?type=series&action=get_ordered_list" +
                          "&JsHttpRequest=1-xml&movie_id=" +
                          enc(id) + "&p=1",

                          workingPortal +
                          "?type=series&action=get_episodes" +
                          "&JsHttpRequest=1-xml&series_id=" +
                          enc(id) + "&p=1"
                  };

                  for (String q : queries) {
                      try {
                          ArrayList<JSONObject> a = extractArray(getJson(q));
                          if (!a.isEmpty()) return a;
                      } catch (Exception ignored) {}
                  }

                  return new ArrayList<>();
              }

              private void showEpisodes(String name,
                                        ArrayList<JSONObject> episodes) {
                  content.removeAllViews();

                  TextView back = text("←  " + name, 20, TEXT);
                  back.setPadding(8, 8, 8, 18);
                  back.setOnClickListener(v -> loadMode());
                  content.addView(back);

                  for (JSONObject e : episodes) {
                      String title = e.optString("name", "Episode");

                      Button b = button("▶  " + title);
                      b.setGravity(Gravity.LEFT | Gravity.CENTER_VERTICAL);
                      b.setOnClickListener(v -> playEpisode(e));

                      LinearLayout.LayoutParams bp =
                              new LinearLayout.LayoutParams(-1, 58);
                      bp.bottomMargin = 7;

                      content.addView(b, bp);
                  }

                  status.setText(episodes.size() + " episodes");
              }

              private void playEpisode(JSONObject episode) {
                  String id = episode.optString(
                          "id", episode.optString("episode_id", ""));

                  new Thread(() -> {
                      try {
                          JSONObject d = getJson(
                                  workingPortal +
                                  "?type=series&action=create_link" +
                                  "&JsHttpRequest=1-xml&movie_id=" +
                                  enc(id) +
                                  "&cmd=" +
                                  enc("ffmpeg http://localhost/movie/" + id));

                          openStream(extractUrl(d));

                      } catch (Exception e) {
                          runOnUiThread(() ->
                                  status.setText(
                                          "Episode playback error: " +
                                          e.getMessage()));
                      }
                  }).start();
              }

              private String extractUrl(JSONObject d) throws Exception {
                  JSONObject js = d.optJSONObject("js");

                  if (js == null) {
                      throw new Exception("No stream returned");
                  }

                  String u = js.optString("cmd", "");

                  if (u.isEmpty()) u = js.optString("url", "");
                  if (u.isEmpty()) u = js.optString("link", "");
                  if (u.isEmpty()) u = js.optString("stream_url", "");

                  if (u.isEmpty()) {
                      throw new Exception("No stream URL returned");
                  }

                  return u.replaceFirst("^(ffmpeg|vlc)\\s+", "").trim();
              }

              private void openStream(String stream) {
                  runOnUiThread(() -> {
                      stopPlayer();

                      player = new ExoPlayer.Builder(this).build();
                      playerView = new PlayerView(this);

                      playerView.setPlayer(player);
                      playerView.setUseController(true);
                      playerView.setKeepScreenOn(true);
                      playerView.setBackgroundColor(Color.BLACK);

                      setContentView(playerView);

                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE);

                      player.addListener(new Player.Listener() {
                          @Override
                          public void onPlayerError(PlaybackException error) {
                              Toast.makeText(
                                      MainActivity.this,
                                      "Playback error: " + error.getMessage(),
                                      Toast.LENGTH_LONG).show();
                          }
                      });

                      player.setMediaItem(
                              MediaItem.fromUri(Uri.parse(stream)));

                      player.prepare();
                      player.play();
                  });
              }

              private void stopPlayer() {
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (player != null) {
                      stopPlayer();
                      getWindow().getDecorView().setSystemUiVisibility(0);
                      showHome();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  stopPlayer();
                  super.onDestroy();
              }

              private JSONObject getJson(String urlString) throws Exception {
                  HttpURLConnection c =
                          (HttpURLConnection)
                                  new URL(urlString).openConnection();

                  c.setConnectTimeout(10000);
                  c.setReadTimeout(20000);
                  c.setRequestMethod("GET");

                  c.setRequestProperty(
                          "User-Agent",
                          "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");

                  c.setRequestProperty(
                          "X-User-Agent",
                          "Model: MAG250; Link: WiFi");

                  c.setRequestProperty("Accept", "*/*");

                  c.setRequestProperty(
                          "Referer",
                          "http://localhost/stalker_portal/c/");

                  c.setRequestProperty(
                          "Cookie",
                          "mac=" + mac +
                          "; stb_lang=en; timezone=Europe/London");

                  if (!token.isEmpty()) {
                      c.setRequestProperty(
                              "Authorization",
                              "Bearer " + token);
                  }

                  int code = c.getResponseCode();

                  if (code != 200) {
                      throw new Exception("HTTP " + code);
                  }

                  BufferedReader r =
                          new BufferedReader(
                                  new InputStreamReader(
                                          c.getInputStream()));

                  StringBuilder b = new StringBuilder();
                  String line;

                  while ((line = r.readLine()) != null) {
                      b.append(line);
                  }

                  r.close();
                  c.disconnect();

                  return new JSONObject(b.toString());
              }

              private String normalize(String p) {
                  p = p.trim();

                  while (p.endsWith("/")) {
                      p = p.substring(0, p.length() - 1);
                  }

                  if (p.endsWith("/portal.php")) return p;
                  if (p.endsWith("/c")) return p + "/portal.php";

                  return p + "/c/portal.php";
              }

              private String enc(String s) throws Exception {
                  return URLEncoder.encode(s, "UTF-8");
              }
          }
          EOF

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StalkerIPTV-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
