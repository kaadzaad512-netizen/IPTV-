name: Build Professional Stalker IPTV Player APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 26.1.10909125

    - name: Make Build Script Executable
      run: chmod +x ./main.sh

    - name: Execute Shell Build Automation
      run: .github/workflows/main.sh
      env:
        STALKER_PORTAL_API: ${{ secrets.STALKER_PORTAL_API }}

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: professional-stalker-player-release
        path: app/build/outputs/apk/release/*.apk
        
