name: Build APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/stb/iptv \
                   app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.stb.iptv"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.stb.iptv"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("io.coil-kt:coil-compose:2.7.0")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-exoplayer-rtsp:1.4.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.4.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="STB Player Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App">
                  <activity
                      android:name=".PlayerActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize"
                      android:exported="false" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B1020</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/res/drawable/bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:angle="270"
                  android:startColor="#0B1020"
                  android:centerColor="#101A33"
                  android:endColor="#0B1020" />
          </shape>
          XEOF

          cat > app/src/main/java/com/stb/iptv/StalkerRepository.kt <<'XEOF'
          package com.stb.iptv

          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          data class Session(val portal: String, val token: String, val mac: String)

          data class MediaItem(
              val id: String,
              val name: String,
              val type: String,
              val group: String = "",
              val cmd: String = "",
              val posterUrl: String = ""
          )

          class StalkerRepository {
              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()

              private val ua = "Mozilla/5.0 (QtEmbedded; U; Linux; C) " +
                  "AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 " +
                  "rev: 250 Safari/533.3"

              fun normalizeMac(raw: String): String? {
                  val v = raw.filter { it.isDigit() || it.uppercaseChar() in 'A'..'F' }
                      .uppercase()
                  return if (v.length == 12) v.chunked(2).joinToString(":") else null
              }

              private fun urls(portal: String) = portal.trim().trimEnd('/').let { c ->
                  if (c.endsWith("/portal.php")) listOf(c) else listOf(
                      "$c/c/portal.php", "$c/portal.php", "$c/server/load.php"
                  ).distinct()
              }

              private fun normalizeUrl(base: String, raw: String): String {
                  val v = raw.trim()
                  if (v.isEmpty()) return ""
                  if (v.startsWith("http://") || v.startsWith("https://")) return v
                  if (v.startsWith("//")) return "https:$v"
                  if (v.startsWith("/")) return "${base.trimEnd('/')}$v"
                  return "${base.trimEnd('/')}/$v"
              }

              private fun posterFrom(obj: JSONObject, base: String): String {
                  val keys = listOf(
                      "poster", "cover", "image", "img", "logo", "icon",
                      "thumb", "screenshot", "screen", "poster_url", "cover_url"
                  )

                  for (key in keys) {
                      val raw = obj.optString(key).trim()
                      if (raw.isNotBlank()) return normalizeUrl(base, raw)
                  }

                  for (key in listOf("poster", "cover", "image", "img")) {
                      val child = obj.optJSONObject(key)
                      if (child != null) {
                          val raw = child.optString("url", child.optString("src", ""))
                          if (raw.isNotBlank()) return normalizeUrl(base, raw)
                      }
                  }

                  return ""
              }

              fun call(url: String, params: Map<String, String>, s: Session? = null): JSONObject {
                  val u = url.toHttpUrl().newBuilder().apply {
                      params.forEach { (k, v) -> addQueryParameter(k, v) }
                  }.build()

                  val rb = Request.Builder().url(u)
                      .header("User-Agent", ua)
                      .header("X-User-Agent", "Model: MAG254; Link: Ethernet")
                      .header("Accept", "*/*")

                  if (s != null) {
                      rb.header("Authorization", "Bearer ${s.token}")
                      rb.header("Cookie", "mac=${s.mac}; stb_lang=en; timezone=UTC")
                  }

                  http.newCall(rb.build()).execute().use { r ->
                      val body = r.body?.string().orEmpty()
                      if (!r.isSuccessful || body.isBlank()) throw IOException("HTTP ${r.code}")
                      return JSONObject(body)
                  }
              }

              fun connect(portal: String, rawMac: String): Session {
                  val mac = normalizeMac(rawMac) ?: throw IllegalArgumentException("Invalid MAC")
                  var last: Exception = IOException("handshake failed")

                  for (u in urls(portal)) {
                      try {
                          val js = call(
                              u,
                              mapOf(
                                  "type" to "stb",
                                  "action" to "handshake",
                                  "token" to "",
                                  "JsHttpRequest" to "1-xml",
                                  "mac" to mac
                              )
                          ).optJSONObject("js")

                          val tok = js?.optString("token").orEmpty().substringBefore("~").trim()
                          if (tok.isNotEmpty()) return Session(u, tok, mac)
                      } catch (e: Exception) {
                          last = e
                      }
                  }

                  throw last
              }

              private fun profile(s: Session): JSONObject = try {
                  call(
                      s.portal,
                      mapOf(
                          "type" to "stb",
                          "action" to "get_profile",
                          "JsHttpRequest" to "1-xml"
                      ),
                      s
                  ).optJSONObject("js") ?: JSONObject()
              } catch (_: Exception) {
                  JSONObject()
              }

              fun expiry(s: Session): String {
                  val keys = arrayOf(
                      "phone", "expire_date", "expire", "end_date", "end_time",
                      "expired", "valid_to"
                  )

                  val sources = mutableListOf(profile(s))

                  for (p in listOf(
                      mapOf("type" to "account_info", "action" to "get_account_info"),
                      mapOf("type" to "stb", "action" to "get_profile")
                  )) {
                      try {
                          call(s.portal, p + mapOf("JsHttpRequest" to "1-xml", "mac" to s.mac))
                              .optJSONObject("js")?.let { sources.add(it) }
                      } catch (_: Exception) {}
                  }

                  for (js in sources) {
                      for (obj in listOfNotNull(js, js.optJSONObject("account"))) {
                          for (k in keys) {
                              var v = obj.optString(k).trim()
                              if (v.isEmpty() || v == "0" || v == "null" || v.startsWith("0000")) continue
                              if (v.matches(Regex("\\d{9,13}"))) {
                                  var ts = v.toLong()
                                  if (ts > 1000000000000L) ts /= 1000
                                  if (ts < 1000000000L) continue
                                  return SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US)
                                      .format(Date(ts * 1000))
                              }
                              if (v.length >= 10) return v.substring(0, 10)
                          }
                      }
                  }

                  return "unlimited/unknown"
              }

              private fun items(
                  s: Session,
                  type: String,
                  action: String,
                  extra: Map<String, String> = emptyMap()
              ): List<MediaItem> {
                  val p = mutableMapOf(
                      "type" to type,
                      "action" to action,
                      "JsHttpRequest" to "1-xml"
                  )
                  p.putAll(extra)

                  val json = try {
                      call(s.portal, p, s)
                  } catch (_: Exception) {
                      return emptyList()
                  }

                  val js = json.optJSONObject("js") ?: JSONObject()
                  val arr = js.optJSONArray("data") ?: return emptyList()

                  val out = mutableListOf<MediaItem>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val id = o.optString("id").ifBlank { o.optString("ch_id") }
                      if (id.isNotBlank()) {
                          val cmd = o.optString("cmd", o.optString("stream", o.optString("link", "")))
                          out.add(
                              MediaItem(
                                  id = id,
                                  name = o.optString("name", o.optString("title", "Untitled")),
                                  type = type,
                                  group = o.optString("tv_genre_id", ""),
                                  cmd = cmd,
                                  posterUrl = posterFrom(o, s.portal)
                              )
                          )
                      }
                  }

                  return out.distinctBy { it.id }
              }

              fun live(s: Session) = livePage(s, 1)
              fun vod(s: Session) = vodPage(s, 1)
              fun series(s: Session) = seriesPage(s, 1)

              fun livePage(s: Session, page: Int = 1): List<MediaItem> {
                  return items(s, "itv", "get_all_channels", mapOf("force_all" to "1", "p" to "$page"))
                      .ifEmpty {
                          items(s, "itv", "get_all_channels")
                      }.ifEmpty {
                          var pageNum = 1
                          val acc = mutableListOf<MediaItem>()
                          while (pageNum < 40) {
                              val p = items(
                                  s, "itv", "get_ordered_list",
                                  mapOf("p" to "$pageNum", "genre" to "0", "fav" to "0", "sortby" to "number")
                              )
                              if (p.isEmpty()) break
                              acc += p
                              pageNum++
                          }
                          acc
                      }
              }

              fun vodPage(s: Session, page: Int = 1): List<MediaItem> {
                  return items(s, "vod", "get_ordered_list", mapOf("p" to "$page"))
              }

              fun seriesPage(s: Session, page: Int = 1): List<MediaItem> {
                  return items(s, "series", "get_ordered_list", mapOf("p" to "$page"))
              }

              fun resolveFfmpegUrl(raw: String): String {
                  val text = raw.trim()
                  if (text.isBlank()) return ""

                  val direct = Regex("https?://\\S+").find(text)?.value
                  if (direct != null) return direct

                  val fromCmd = Regex("""(?:https?|rtsp|rtmp|mms)://[^\s'"]+""", RegexOption.IGNORE_CASE)
                      .find(text)?.value
                  if (fromCmd != null) return fromCmd

                  return text
              }

              fun stream(s: Session, it: MediaItem): String {
                  val direct = resolveFfmpegUrl(it.cmd)
                  if (direct.isNotBlank()) return rewrite(direct, s)

                  for (params in listOf(
                      mapOf(
                          "cmd" to URLEncoder.encode(it.cmd, "UTF-8"),
                          "forced_storage" to "undefined",
                          "disable_ad" to "0"
                      ),
                      mapOf("cmd" to it.cmd)
                  )) {
                      try {
                          val js = call(
                              s.portal,
                              mapOf(
                                  "type" to it.type,
                                  "action" to "create_link",
                                  "JsHttpRequest" to "1-xml"
                              ) + params,
                              s
                          ).optJSONObject("js")

                          var u = js?.optString("cmd", js.optString("url")).orEmpty()
                          if (u.isNotBlank()) {
                              u = u.replace(Regex("^(ffrt\\d*\\s+|ffmpeg\\s+|mpv\\s+|http\\s+)"), "").trim()
                              val cleaned = resolveFfmpegUrl(u)
                              if (cleaned.isNotBlank()) return rewrite(cleaned, s)
                              return rewrite(u, s)
                          }
                      } catch (_: Exception) {}
                  }
                  return ""
              }

              private fun rewrite(u: String, s: Session): String {
                  val host = Regex("https?://([^/]+)").find(s.portal)?.groupValues?.get(1) ?: return u
                  return if (Regex("^https?://(portal|127\\.0\\.0\\.1)").containsMatchIn(u)) {
                      u.replaceFirst(Regex("^(https?://)[^/]+"), "$1$host")
                  } else {
                      u
                  }
              }

              fun m3uPlaylist(s: Session, title: String = "Portal"): String {
                  val items = live(s)
                  val sb = StringBuilder()
                  sb.append("#EXTM3U\n")
                  items.forEach { item ->
                      val url = stream(s, item)
                      if (url.isNotBlank()) {
                          sb.append("#EXTINF:-1")
                          if (item.posterUrl.isNotBlank()) sb.append(" tvg-logo=\"${item.posterUrl}\"")
                          if (item.group.isNotBlank()) sb.append(" group-title=\"${item.group}\"")
                          sb.append(",${item.name}\n")
                          sb.append("$url\n")
                      }
                  }
                  return sb.toString()
              }
          }
          XEOF

          cat > app/src/main/java/com/stb/iptv/MacScanner.kt <<'XEOF'
          package com.stb.iptv

          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CountDownLatch
          import kotlin.random.Random

          data class Hit(val mac: String, val exp
