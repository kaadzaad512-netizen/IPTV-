name: Build APK

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate app
        run: |
          mkdir -p app/src/main/java/com/stb/iptv app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.stb.iptv"
              compileSdk = 34
              defaultConfig { applicationId = "com.stb.iptv"; minSdk = 24; targetSdk = 34; versionCode = 5; versionName = "5.0" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.4.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="STB Player Pro" android:usesCleartextTraffic="true" android:theme="@style/Theme.App">
                  <activity android:name=".PlayerActivity" android:screenOrientation="landscape" android:exported="false"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.App" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/stb/iptv/StalkerRepository.kt <<'EOF'
          package com.stb.iptv
          import okhttp3.*
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import org.json.JSONObject
          import java.io.IOException
          import java.net.URLDecoder
          import java.net.URLEncoder
          import java.util.concurrent.TimeUnit

          data class Session(val portal:String,val token:String,val mac:String)
          data class MediaItem(val id:String,val name:String,val type:String,val cmd:String="",val poster:String="",val group:String="")

          class StalkerRepository {
              private val client = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private val ua = "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 MAG200 stbapp"

              private fun mac(raw:String):String?{
                  val v=raw.filter{it.isDigit() || it.uppercaseChar() in 'A'..'F'}.uppercase()
                  return if(v.length==12) v.chunked(2).joinToString(":") else null
              }

              private fun endpoints(p:String)=p.trim().trimEnd('/').let{
                  if(it.endsWith("/portal.php")) listOf(it) else listOf("$it/c/portal.php","$it/portal.php","$it/server/load.php")
              }

              private fun cleanUrl(base:String,raw:String):String{
                  val v=raw.trim()
                  if(v.isEmpty()) return ""
                  if(v.startsWith("http://")||v.startsWith("https://")) return v
                  if(v.startsWith("//")) return "https:$v"
                  if(v.startsWith("/")) return base.substringBefore("/portal.php").trimEnd('/') + v
                  return base.trimEnd('/')+"/"+v
              }

              private fun call(url:String,params:Map<String,String>,s:Session?=null):JSONObject{
                  val u=url.toHttpUrl().newBuilder().apply{params.forEach{(k,v)->addQueryParameter(k,v)}}.build()
                  val b=Request.Builder().url(u).header("User-Agent",ua).header("X-User-Agent","Model: MAG254; Link: Ethernet").header("Accept","*/*")
                  if(s!=null){ b.header("Authorization","Bearer ${s.token}"); b.header("Cookie","mac=${s.mac}; stb_lang=en; timezone=UTC") }
                  client.newCall(b.build()).execute().use{ r ->
                      val body=r.body?.string().orEmpty()
                      if(!r.isSuccessful || body.isBlank()) throw IOException("HTTP ${r.code}")
                      return JSONObject(body)
                  }
              }

              fun connect(portal:String,rawMac:String):Session{
                  val mac=mac(rawMac) ?: throw IllegalArgumentException("Invalid MAC")
                  var last:Exception = IOException("handshake failed")
                  for(u in endpoints(portal)) {
                      try {
                          val js = call(u, mapOf("type" to "stb","action" to "handshake","token" to "","JsHttpRequest" to "1-xml","mac" to mac)).optJSONObject("js")
                          val token = js?.optString("token").orEmpty().substringBefore("~").trim()
                          if(token.isNotBlank()) return Session(u, token, mac)
                      } catch (e:Exception){ last = e }
                  }
                  throw last
              }

              fun page(s:Session,type:String,page:Int):List<MediaItem>{
                  val json = try { call(s.portal, mapOf("type" to type,"action" to if(type=="itv") "get_all_channels" else "get_ordered_list","p" to page.toString(),"page" to page.toString(),"JsHttpRequest" to "1-xml"), s) } catch (_:Exception){ return emptyList() }
                  val arr=json.optJSONObject("js")?.optJSONArray("data") ?: return emptyList()
                  val out=mutableListOf<MediaItem>()
                  for(i in 0 until arr.length()){
                      val o=arr.optJSONObject(i) ?: continue
                      val id=o.optString("id").ifBlank{o.optString("ch_id")}
                      if(id.isBlank()) continue
                      val poster = listOf(o.optString("poster"),o.optString("cover"),o.optString("image"),o.optString("img"),o.optString("logo"),o.optString("icon")).firstOrNull{it.isNotBlank()} ?: ""
                      val cmd = o.optString("cmd", o.optString("stream", o.optString("link", "")))
                      out.add(MediaItem(id,o.optString("name",o.optString("title","Untitled")),type,cmd,cleanUrl(s.portal,poster),o.optString("tv_genre_id","")))
                  }
                  return out.distinctBy { it.id }
              }

              fun stream(s:Session,it:MediaItem):String{
                  val raw=it.cmd.trim()
                  if(raw.isBlank()) return ""
                  val extracted = Regex("""(?i)(?:https?|rtsp|rtmp|mms)://[^\s'"]+""").find(raw)?.value
                  if(extracted!=null) return extracted
                  for(candidate in listOf(raw, URLDecoder.decode(raw,"UTF-8"))){
                      try{
                          val js = call(s.portal,mapOf("type" to it.type, "action" to "create_link","cmd" to URLEncoder.encode(candidate,"UTF-8"),"JsHttpRequest" to "1-xml"),s)
                          val u = js.optJSONObject("js")?.optString("cmd", js.optJSONObject("js")?.optString("url","")).orEmpty()
                          val e = Regex("""(?i)(?:https?|rtsp|rtmp|mms)://[^\s'"]+""").find(u)?.value
                          if(e!=null) return e
                      }catch(_:Exception){}
                  }
                  return ""
              }

              fun m3u(s:Session,items:List<MediaItem>):String{
                  val sb=StringBuilder()
                  sb.append("#EXTM3U\n")
                  items.forEach{it->
                      val u=stream(s,it)
                      if(u.isNotBlank()){
                          sb.append("#EXTINF:-1")
                          if(it.poster.isNotBlank()) sb.append(" tvg-logo=\"${it.poster}\"")
                          if(it.group.isNotBlank()) sb.append(" group-title=\"${it.group}\"")
                          sb.append(",${it.name}\n")
                          sb.append("$u\n")
                      }
                  }
                  return sb.toString()
              }
          }
          EOF

          cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'EOF'
          package com.stb.iptv

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme(colorScheme = darkColorScheme(primary = Color(0xFF22C55E))) { MainScreen() } }
              }
          }

          @Composable
          fun MainScreen() {
              val repo = remember { StalkerRepository() }
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var portal by remember { mutableStateOf("") }
              var mac by remember { mutableStateOf("") }
              var tab by remember { mutableIntStateOf(0) }
              var page by remember { mutableIntStateOf(1) }
              var items by remember { mutableStateOf(listOf<MediaItem>()) }
              var session by remember { mutableStateOf<Session?>(null) }
              var loading by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("idle") }
              var search by remember { mutableStateOf("") }
              var m3u by remember { mutableStateOf("") }

              fun load(reset:Boolean=false){
                  val s=session ?: return
                  scope.launch {
                      loading = true
                      try {
                          val r = withContext(Dispatchers.IO){ repo.page(s, if(tab==0) "itv" else if(tab==1) "vod" else "series", page) }
                          items = if(reset) r else items + r
                          status = "${items.size} items"
                      } catch (e:Exception){ status = e.message ?: "load failed" } finally { loading = false }
                  }
              }

              fun connect(){
                  scope.launch {
                      loading = true
                      try {
                          val s = withContext(Dispatchers.IO){ repo.connect(portal, mac) }
                          session = s
                          page = 1
                          items = emptyList()
                          load(true)
                      } catch (e:Exception){ status = e.message ?: "connect failed" } finally { loading = false }
                  }
              }

              fun play(item:MediaItem){
                  val s=session ?: return
                  scope.launch {
                      loading = true
                      try{
                          val url = withContext(Dispatchers.IO){ repo.stream(s, item) }
                          if(url.isBlank()) { status = "Stream URL unavailable"; return@launch }
                          ctx.startActivity(Intent(ctx, PlayerActivity::class.java).apply{ putExtra("url", url); putExtra("title", item.name) })
                      }catch(e:Exception){ status = e.message ?: "player failed" } finally { loading = false }
                  }
              }

              Column(Modifier.fillMaxSize().padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Text("STB Player Pro", style = MaterialTheme.typography.headlineSmall)
                  Text(status)

                  OutlinedTextField(value = portal, onValueChange = { portal = it }, label = { Text("Portal URL") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(value = mac, onValueChange = { mac = it }, label = { Text("MAC") }, singleLine = true, modifier = Modifier.weight(1f))
                      Button(onClick = { connect() }, enabled = !loading) { Text("Connect") }
                  }

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("Live","VOD","Series").forEachIndexed { i, label ->
                          FilterChip(selected = tab == i, onClick = { tab = i; page = 1; items = emptyList(); load(true) }, label = { Text(label) })
                      }
                  }

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(onClick = { if(session != null) m3u = repo.m3u(session!!, items) }, enabled = session != null) { Text("M3U") }
                      OutlinedTextField(value = search, onValueChange = { search = it }, label = { Text("Search") }, singleLine = true, modifier = Modifier.weight(1f))
                  }

                  if(m3u.isNotBlank()) OutlinedTextField(value = m3u, onValueChange = {}, label = { Text("M3U playlist") }, modifier = Modifier.fillMaxWidth().height(140.dp))

                  LazyColumn(verticalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.fillMaxHeight()) {
                      items(items.filter { it.name.contains(search, true) }) { item ->
                          Card(Modifier.fillMaxWidth().clickable { play(item) }) {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Start) {
                                  if(item.poster.isNotBlank()) AsyncImage(model = item.poster, contentDescription = item.name, modifier = Modifier.size(84.dp).padding(6.dp))
                                  Text(item.name, modifier = Modifier.padding(14.dp))
                              }
                          }
                      }
                  }

                  Button(onClick = { page += 1; load(false) }, enabled = session != null && !loading) { Text("Load more") }
              }
          }
          EOF

          cat > app/src/main/java/com/stb/iptv/PlayerActivity.kt <<'EOF'
          package com.stb.iptv

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.datasource.okhttp.OkHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView

          class PlayerActivity : ComponentActivity() {
              private var player: ExoPlayer? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { PlayScreen(intent.getStringExtra("url").orEmpty()) }
              }

              @Composable
              private fun PlayScreen(url: String) {
                  AndroidView(modifier = Modifier.fillMaxSize(), factory = { context ->
                      PlayerView(context).apply {
                          val ds = OkHttpDataSource.Factory(okhttp3.OkHttpClient()).setUserAgent("Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 MAG200 stbapp")
                          val exo = ExoPlayer.Builder(context).setMediaSourceFactory(DefaultMediaSourceFactory(ds)).build()
                          player = exo
                          exo.setMediaItem(MediaItem.fromUri(url))
                          exo.prepare()
                          exo.playWhenReady = true
                      }
                  })
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: stalker-iptv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
